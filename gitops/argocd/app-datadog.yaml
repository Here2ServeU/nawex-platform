apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: datadog-agent
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/Here2ServeU/express-reliability-aiops-platform.git'
    targetRevision: HEAD
    path: helm/datadog
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Datadog DaemonSets can be large, so we allow empty resources to prevent sync errors
      - ServerSideApply=true
