apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: splunk-forwarder
  namespace: logging
  labels:
    env: production
    component: observability
    part-of: express-platform
  annotations:
    maintainer: "sre-team@example.com"
    description: "Deploys the Splunk Universal Forwarder DaemonSet for log collection."
spec:
  interval: 1m
  releaseName: splunk-forwarder
  targetNamespace: logging
  storageNamespace: logging
  chart:
    spec:
      chart: ./helm/splunk-forwarder
      sourceRef:
        kind: GitRepository
        name: express-platform
        namespace: flux-system
      interval: 1m
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
      remediateLastFailure: true
  test:
    enable: true
  values:
    # Default values; override with sensitive secrets via 'valuesFrom' in production
    splunk:
      hec:
        host: "splunk-hec.example.com"
