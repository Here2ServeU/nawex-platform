apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: datadog
  namespace: flux-system
spec:
  targetNamespace: monitoring
  interval: 5m
  chart:
    spec:
      chart: ./helm/datadog
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    datadog:
      apiKeyExistingSecret: datadog-secret
