apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: { name: require-requests-limits }
spec:
  validationFailureAction: enforce
  background: true
  rules:
    - name: check-resources
      match: { any: [ { resources: { kinds: ["Pod","Deployment","StatefulSet","DaemonSet"] } } ] }
      validate:
        message: "CPU and memory requests/limits are required."
        pattern:
          spec:
            containers:
              - resources:
                  requests: { cpu: "?*", memory: "?*" }
                  limits:   { cpu: "?*", memory: "?*" }
