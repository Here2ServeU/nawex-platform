[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "golden-platform"
version = "2.0.0"
description = "Golden Platform — end-to-end enterprise modernization template: VMware-to-OpenShift migration, AI risk and reliability, GPU optimization and AI safety."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Rev. Dr. Emmanuel Naweji" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Private :: Do Not Upload",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "prometheus-client>=0.20",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Deep-learning models (LSTM/TCN) and scikit-learn detectors. Install CUDA wheels for GPU:
#   pip install -e .[ml] --extra-index-url https://download.pytorch.org/whl/cu124
ml = ["torch>=2.4", "scikit-learn>=1.5"]
worker = ["celery>=5.4", "redis>=5.0"]
robotics = ["grpcio>=1.66", "protobuf>=5.27"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "pandas-stubs",
  "grpcio-tools>=1.66",
  "pre-commit>=3.7",
]

[project.scripts]
golden = "golden.cli:main"

[project.urls]
Repository = "https://github.com/Here2ServeU/nawex-platform"

[tool.hatch.build.targets.wheel]
packages = ["src/golden"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["src/golden/robotics/grpc/generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "RUF100"]
ignore = [
  "S101",  # assert is fine in tests
  "S104",  # services bind 0.0.0.0 inside containers by design
  "S311",  # random is used for simulation, never for crypto
  "E501",  # line length is enforced by `ruff format`; long literals are allowed
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
packages = ["golden"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["src/golden/robotics/grpc/generated/"]

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "ml: requires the [ml] extra (torch / scikit-learn)",
  "gpu: requires a CUDA or MPS device",
]
filterwarnings = ["ignore::DeprecationWarning:torch.*"]

[tool.coverage.run]
source = ["golden"]
omit = ["src/golden/robotics/grpc/generated/*"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
