groups:
  # ── Service Availability ──────────────────────────────────────────────────────
  - name: nawex_availability
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} on {{ $labels.instance }} has been unreachable for more than 1 minute."

      - alert: HighErrorRate
        expr: |
          rate(http_requests_total{status=~"5.."}[5m])
          / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on {{ $labels.job }}"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket[5m])
          ) > 2.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on {{ $labels.job }}"
          description: "p95 latency is {{ $value }}s (threshold: 2s)."

  # ── Fintech Alerts ────────────────────────────────────────────────────────────
  - name: nawex_fintech
    interval: 30s
    rules:
      - alert: FraudDetectionDown
        expr: up{job="fintech-fraud-detector"} == 0
        for: 30s
        labels:
          severity: critical
          vertical: fintech
        annotations:
          summary: "Fraud detection service is down"
          description: "The fraud detection service has been unreachable for 30s. Transactions may be unscreened."

      - alert: HighFraudScore
        expr: fraud_score_average > 0.8
        for: 1m
        labels:
          severity: warning
          vertical: fintech
        annotations:
          summary: "Elevated average fraud score detected"
          description: "Average fraud score is {{ $value }} (threshold: 0.8)."

      - alert: TransactionProcessingBacklog
        expr: fintech_transaction_queue_depth > 500
        for: 3m
        labels:
          severity: warning
          vertical: fintech
        annotations:
          summary: "Transaction processing backlog growing"
          description: "Queue depth is {{ $value }} transactions."

      - alert: PaymentGatewayLatencyHigh
        expr: |
          histogram_quantile(0.99,
            rate(http_request_duration_seconds_bucket{job="fintech-payment-gateway"}[5m])
          ) > 5.0
        for: 2m
        labels:
          severity: critical
          vertical: fintech
        annotations:
          summary: "Payment gateway p99 latency > 5s"
          description: "p99 payment gateway latency is {{ $value }}s."

  # ── Healthcare Alerts ─────────────────────────────────────────────────────────
  - name: nawex_healthcare
    interval: 30s
    rules:
      - alert: EHRIngestionDown
        expr: up{job="healthcare-ehr-ingestion"} == 0
        for: 30s
        labels:
          severity: critical
          vertical: healthcare
        annotations:
          summary: "EHR ingestion service is down"
          description: "EHR ingestion has been unreachable for 30s. Patient records may be delayed."

      - alert: ClinicalDecisionServiceDown
        expr: up{job="healthcare-clinical-decision"} == 0
        for: 30s
        labels:
          severity: critical
          vertical: healthcare
        annotations:
          summary: "Clinical decision support is down"
          description: "Clinical decision service is unavailable for 30s."

      - alert: PatientDataIngestionLag
        expr: ehr_ingestion_lag_seconds > 300
        for: 5m
        labels:
          severity: warning
          vertical: healthcare
        annotations:
          summary: "EHR ingestion lag > 5 minutes"
          description: "Patient data ingestion lag is {{ $value }}s."

  # ── Infrastructure Alerts ─────────────────────────────────────────────────────
  - name: nawex_infrastructure
    interval: 30s
    rules:
      - alert: KafkaBrokerDown
        expr: up{job="kafka"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kafka broker is unreachable"
          description: "Kafka broker has been down for 1 minute."

      - alert: KafkaConsumerLag
        expr: kafka_consumer_group_lag > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag is high"
          description: "Consumer group {{ $labels.consumergroup }} lag is {{ $value }}."

      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage > 85%"
          description: "Redis instance {{ $labels.instance }} memory is at {{ $value | humanizePercentage }}."

      - alert: HighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}% (threshold: 85%)."

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk space critically low on {{ $labels.instance }}"
          description: "Available disk space is {{ $value }}%."
