version: '3.8'
services:
  app:
    build: .
    ports:
      - "3000:3000" # The Node App
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000" # HOST 3001 maps to CONTAINER 3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - monitoring

  aiops:
    build: ./aiops_engine
    environment:
      - SLACK_WEBHOOK_URL=https://hooks.slack.com/services/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
    depends_on:
      - prometheus
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
