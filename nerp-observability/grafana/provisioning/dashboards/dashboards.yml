apiVersion: 1

providers:
  - name: NERP Dashboards
    orgId: 1
    folder: NERP Platform
    folderUid: nerp-platform
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: true
