global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.example.com:587"
  smtp_from: "alerts@nerp-platform.io"
  smtp_auth_username: "alerts@nerp-platform.io"
  smtp_auth_password: "${SMTP_PASSWORD}"
  slack_api_url: "${SLACK_WEBHOOK_URL}"
  pagerduty_url: "https://events.pagerduty.com/v2/enqueue"

templates:
  - "/etc/alertmanager/templates/*.tmpl"

# ── Routing Tree ──────────────────────────────────────────────────────────────
route:
  group_by: ["alertname", "job", "vertical"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: slack-default

  routes:
    # Critical alerts → PagerDuty (immediate on-call)
    - match:
        severity: critical
      receiver: pagerduty-critical
      group_wait: 10s
      repeat_interval: 1h
      continue: true   # also notify slack

    # Fintech vertical alerts
    - match:
        vertical: fintech
      receiver: slack-fintech
      group_by: ["alertname", "job"]

    # Healthcare vertical alerts (HIPAA-aware: no PHI in notifications)
    - match:
        vertical: healthcare
      receiver: slack-healthcare
      group_by: ["alertname", "job"]

    # SLO breach alerts
    - match:
        slo: error_budget
      receiver: slo-channel

    # Default catch-all: Slack general
    - match_re:
        severity: "warning|info"
      receiver: slack-default

# ── Inhibition Rules ──────────────────────────────────────────────────────────
inhibit_rules:
  # If a service is completely down, suppress its latency/error-rate warnings
  - source_match:
      alertname: ServiceDown
    target_match_re:
      alertname: "(HighErrorRate|HighLatency)"
    equal: ["job"]

  # If Kafka is down, suppress consumer lag warnings
  - source_match:
      alertname: KafkaBrokerDown
    target_match:
      alertname: KafkaConsumerLag

# ── Receivers ─────────────────────────────────────────────────────────────────
receivers:
  - name: slack-default
    slack_configs:
      - channel: "#nerp-alerts"
        send_resolved: true
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Job:* {{ .Labels.job }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  - name: slack-fintech
    slack_configs:
      - channel: "#nerp-fintech-alerts"
        send_resolved: true
        title: '[FINTECH {{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  - name: slack-healthcare
    slack_configs:
      - channel: "#nerp-healthcare-alerts"
        send_resolved: true
        title: '[HEALTHCARE {{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Severity:* {{ .Labels.severity }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key: "${PAGERDUTY_ROUTING_KEY}"
        description: "{{ .CommonLabels.alertname }}: {{ .CommonAnnotations.summary }}"
        severity: "{{ .CommonLabels.severity }}"
        details:
          platform: nerp
          environment: production
          job: "{{ .CommonLabels.job }}"

  - name: slo-channel
    slack_configs:
      - channel: "#nerp-slo-burn"
        send_resolved: true
        title: '[SLO {{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *SLO Breach:* {{ .Annotations.summary }}
          *Detail:* {{ .Annotations.description }}
          {{ end }}
        color: 'danger'
    email_configs:
      - to: "sre-team@nerp-platform.io"
        send_resolved: true
        subject: "[SLO] {{ .CommonLabels.alertname }} — {{ .Status | toUpper }}"
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          {{ end }}
