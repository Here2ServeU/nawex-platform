apiVersion: v1
kind: ServiceAccount
metadata:
  name: golden-workload-sa
  namespace: golden
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: golden-workload-read
  namespace: golden
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: golden-workload-read-binding
  namespace: golden
subjects:
  - kind: ServiceAccount
    name: golden-workload-sa
    namespace: golden
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: golden-workload-read
