# Trivy configuration (https://trivy.dev/latest/docs/references/configuration/config-file/)
# Usage: trivy image --config security/container-scanning/trivy.yaml <image>
format: table
exit-code: 1
severity:
  - HIGH
  - CRITICAL
timeout: 10m0s
# Repo-wide accepted exceptions (YAML format, with justifications). Image CVE
# suppressions live in security/container-scanning/trivy-ignore.txt and are
# passed explicitly by scan-images.sh.
ignorefile: .trivyignore.yaml

scan:
  scanners:
    - vuln
    - secret
    - misconfig

pkg:
  types:
    - os
    - library

vulnerability:
  ignore-unfixed: true
