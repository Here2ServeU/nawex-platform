rules:
  # Rule 1: High Latency -> Scale Up
  - id: "rule-001"
    trigger: "latency_risk"
    level: "high"
    action: "scale_up_replicas"
    params:
      target: "frontend-service"
      replicas: 5

  # Rule 2: Critical Error Rate -> Restart Service
  - id: "rule-002"
    trigger: "error_risk"
    level: "critical"
    action: "restart_service"
    params:
      target: "backend-api"
      strategy: "rolling_update"

  # Rule 3: Wasted Resources -> Optimize (FinOps)
  - id: "rule-003"
    trigger: "efficiency_risk"
    level: "low"
    action: "optimize_resources"
    params:
      target: "data-processor"
      cpu_limit: "500m"

  # Rule 4: Memory Leak -> Restart
  - id: "rule-004"
    trigger: "memory_risk"
    level: "critical"
    action: "restart_service"
    params:
      target: "cache-layer"

  # --- Fintech-Specific Rules ---

  # Rule 5: Transaction Fraud Spike -> Isolate & Block
  - id: "rule-005"
    trigger: "fraud_spike"
    level: "critical"
    action: "isolate_fraud_transactions"
    params:
      target: "payment-gateway"
      block_threshold: 0.90
      notify: "fraud-ops-team"
      escalation: "immediate"

  # Rule 6: Payment Gateway Latency -> Failover
  - id: "rule-006"
    trigger: "payment_latency_risk"
    level: "high"
    action: "failover_payment_gateway"
    params:
      primary: "payment-gateway-primary"
      secondary: "payment-gateway-secondary"
      latency_threshold_ms: 100

  # Rule 7: Settlement Processing Failure -> Halt & Alert
  - id: "rule-007"
    trigger: "settlement_failure"
    level: "critical"
    action: "halt_settlement"
    params:
      target: "settlement-engine"
      checkpoint: true
      notify: "treasury-ops"

  # Rule 8: API Rate Limit Breach -> Throttle
  - id: "rule-008"
    trigger: "rate_limit_breach"
    level: "high"
    action: "throttle_api_clients"
    params:
      target: "kong-gateway"
      throttle_percent: 50
      allowlist: ["internal-services", "trusted-partners"]

  # Rule 9: Transaction Volume Anomaly -> Scale & Monitor
  - id: "rule-009"
    trigger: "transaction_volume_spike"
    level: "medium"
    action: "scale_up_replicas"
    params:
      target: "transaction-processor"
      replicas: 10
      enable_enhanced_monitoring: true

  # --- Healthcare-Specific Rules ---

  # Rule 10: PHI Breach Detection -> Isolate & Audit
  - id: "rule-010"
    trigger: "phi_breach_detected"
    level: "critical"
    action: "isolate_phi_breach"
    params:
      target: "patient-data-gateway"
      lock_user_sessions: true
      notify: "hipaa-compliance-team"
      escalation: "immediate"
      preserve_audit_trail: true

  # Rule 11: EHR Gateway Latency -> Failover
  - id: "rule-011"
    trigger: "ehr_latency_risk"
    level: "high"
    action: "failover_ehr_gateway"
    params:
      primary: "patient-data-gateway-primary"
      secondary: "patient-data-gateway-secondary"
      latency_threshold_ms: 200

  # Rule 12: Clinical Decision Timeout -> Halt & Alert
  - id: "rule-012"
    trigger: "clinical_decision_timeout"
    level: "critical"
    action: "halt_clinical_pipeline"
    params:
      target: "clinical-decision"
      checkpoint: true
      notify: "clinical-ops-team"
      fallback: "manual_clinical_review"

  # Rule 13: Patient Safety Alert -> Quarantine & Escalate
  - id: "rule-013"
    trigger: "patient_safety_alert"
    level: "critical"
    action: "quarantine_patient_data"
    params:
      target: "ehr-ingestion"
      quarantine_scope: "affected_patient"
      notify: "patient-safety-team"
      escalation: "immediate"
      require_clinician_override: true

  # Rule 14: EHR Ingestion Volume Spike -> Scale & Monitor
  - id: "rule-014"
    trigger: "ehr_volume_spike"
    level: "medium"
    action: "scale_up_replicas"
    params:
      target: "ehr-ingestion"
      replicas: 8
      enable_enhanced_monitoring: true

  # --- GPU / AI-Infrastructure Rules ---

  # Rule 15: Sustained thermal throttling -> move the job off the hot node
  - id: "rule-015"
    trigger: "gpu_thermal_risk"
    level: "critical"
    action: "migrate_gpu_workload"
    params:
      reason: "thermal_throttling"
      cordon_source_node: true

  # Rule 16: Idle GPUs -> reclaim to the shared pool
  - id: "rule-016"
    trigger: "gpu_idle_risk"
    level: "low"
    action: "reclaim_idle_gpus"
    params:
      idle_minutes: 120

  # Rule 17: Under-utilised fleet -> consolidate / bin-pack
  - id: "rule-017"
    trigger: "gpu_efficiency_risk"
    level: "high"
    action: "consolidate_gpu_workloads"
    params:
      target_utilization_pct: 70

  # Rule 18: Power draw over budget -> apply a power cap
  - id: "rule-018"
    trigger: "gpu_power_risk"
    level: "high"
    action: "set_gpu_power_cap"
    params:
      cap_pct_of_tdp: 80

  # Rule 19: ECC / XID errors -> drain the node for hardware triage
  - id: "rule-019"
    trigger: "gpu_hardware_risk"
    level: "critical"
    action: "drain_gpu_node"
    params:
      notify: "infra-oncall"

  # --- VMware -> OpenShift Migration Rules ---

  # Rule 20: Post-cutover validation failed -> roll the wave back to vSphere
  - id: "rule-020"
    trigger: "migration_validation_failure"
    level: "critical"
    action: "vm_rollback"
    params:
      power_on_source: true
      notify: "migration-command-center"
