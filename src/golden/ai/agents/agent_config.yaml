system:
  environment: production
  log_level: INFO
  version: "1.0.0"

agents:
  # Observer Agent: The "Eyes"
  observer:
    observability:
      source: simulated  # Options: simulated, http, prometheus, cloudwatch
      http_endpoint: "http://workload:8080/metrics/json"
      http_timeout_seconds: 3
      collection_interval_seconds: 10
      regions:
        - us-east-1
        - eu-west-1

  # Analyzer Agent: The "Brain" (Detection)
  analyzer:
    thresholds:
      # Infrastructure thresholds
      latency_ms: 200
      error_rate_percent: 1.0
      cpu_usage_percent: 80.0
      memory_usage_percent: 85.0
      # Fintech-specific thresholds
      transaction_latency_ms: 100
      fraud_score_threshold: 0.85
      payment_error_rate_percent: 0.1
      settlement_timeout_minutes: 120
      transaction_velocity_per_hour: 10000
      api_rate_limit_requests_per_sec: 5000
      # Healthcare-specific thresholds
      ehr_query_latency_ms: 200
      clinical_alert_latency_ms: 50
      phi_anomaly_threshold: 0.60
      clinical_decision_timeout_ms: 500
      ehr_ingestion_throughput_rps: 850
      patient_safety_score_threshold: 0.70
    features:
      enable_ml_analysis: true   # uses trained LSTM/TCN when present, statistical fallback otherwise
      ml_sequence_window: 24
      enable_fraud_detection: true
      enable_payment_monitoring: true
      enable_phi_monitoring: true
      enable_clinical_anomaly_detection: true

  # Planner Agent: The "Logic" (Remediation Strategy)
  planner:
    strategy: rule_based
    auto_remediation_enabled: true
    fallback_behavior: manual_review_required

  # Executor Agent: The "Hands" (Action)
  executor:
    # Execution mode is NOT configured here: the AI-safety ActionGovernor enforces
    # GOLDEN_AUTONOMY_MODE (dry_run | supervised | autonomous), the kill switch and rate caps.
    safety:
      max_actions_per_batch: 3
      require_human_approval_for_critical: true
