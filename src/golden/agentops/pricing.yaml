# Token prices in USD per million tokens (MTok). Prices are DATA, never constants in code:
# update this file (or point GOLDEN_PRICING_FILE at your negotiated rate card) when rates change.
# Source: Anthropic first-party API list prices for current models. Bedrock / Vertex differ.
# cache_write / cache_read are multipliers on the input price (prompt caching).
cache_write_multiplier: 1.25
cache_read_multiplier: 0.1
models:
  claude-opus-5-5:   {input: 4.00, output: 20.00}
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  claude-haiku-5-5:  {input: 0.10, output: 0.50}
  # Offline deterministic model used by tests, demos and the capstone proof: priced like Sonnet so
  # the arithmetic is realistic while nothing is ever billed.
  simulated:         {input: 2.00, output: 10.00}
