apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafka-zookeeper.fullname" . }}-zookeeper
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.zookeeper.clientPort }}
      targetPort: {{ .Values.zookeeper.clientPort }}
      name: client
  selector:
    app: zookeeper
