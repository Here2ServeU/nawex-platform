image:
  repository: backstage/backstage
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

replicaCount: 1

service:
  type: ClusterIP
  port: 7007

ingress:
  enabled: true
  className: "nginx"
  annotations:
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # kubernetes.io/ingress.class: nginx
  hosts:
    - host: backstage.express-t2s.com
      paths:
        - path: /
          pathType: Prefix
  tls:
   - secretName: backstage-tls
     hosts:
       - backstage.express-t2s.com

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# ---------------------------------------------------------------------
# Database Configuration (Bitnami PostgreSQL)
# ---------------------------------------------------------------------
postgresql:
  enabled: true
  auth:
    username: backstage
    password: backstage-password
    database: backstage_plugin_catalog
  primary:
    persistence:
      enabled: true
      size: 1Gi
  fullnameOverride: "backstage-postgresql"

# ---------------------------------------------------------------------
# App Configuration (Passed to deployment)
# ---------------------------------------------------------------------
appConfig:
  app:
    baseUrl: https://backstage.express-t2s.com
    title: Express T2S Developer Portal
  backend:
    baseUrl: https://backstage.express-t2s.com
    database:
      client: pg
      connection:
        host: backstage-postgresql
        port: 5432
        user: backstage
        password: backstage-password
