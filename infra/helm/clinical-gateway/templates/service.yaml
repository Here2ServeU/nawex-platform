apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-clinical-gateway
  namespace: healthcare
  labels:
    app: clinical-gateway
    compliance: hipaa
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8095
      protocol: TCP
      name: http
  selector:
    app: clinical-gateway
