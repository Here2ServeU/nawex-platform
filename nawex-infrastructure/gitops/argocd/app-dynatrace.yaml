apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dynatrace-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/Here2ServeU/express-reliability-aiops-platform.git'
    targetRevision: HEAD
    path: helm/dynatrace
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dynatrace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Dynatrace installs extensive CRDs (DynaKube), so ServerSideApply is often required to avoid "Too long: must have at most 262144 bytes" errors
      - ServerSideApply=true
