apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: splunk-forwarder
  namespace: argocd
  labels:
    env: production
    component: observability
    part-of: express-platform
  annotations:
    maintainer: "sre-team@example.com"
    description: "Deploys the Splunk Universal Forwarder DaemonSet for log collection."
spec:
  project: platform
  source:
    repoURL: https://github.com/Here2ServeU/express-t2s-app-v7
    targetRevision: main
    path: helm/splunk-forwarder
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
