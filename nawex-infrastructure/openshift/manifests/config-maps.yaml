apiVersion: v1
kind: ConfigMap
metadata:
  name: nrp-platform-config
  namespace: nrp-platform
  labels:
    app: naweji-reliability-platform
data:
  app.conf: |
    # NRP Platform Configuration
    LOG_LEVEL=info
    NODE_ENV=production
    KAFKA_BROKERS=kafka-0.kafka.nrp-platform.svc.cluster.local:9092,kafka-1.kafka.nrp-platform.svc.cluster.local:9092,kafka-2.kafka.nrp-platform.svc.cluster.local:9092
    ZOOKEEPER_HOSTS=zookeeper:2181
    METRICS_ENABLED=true
    PROMETHEUS_PORT=3000

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nrp-healthcare-config
  namespace: nrp-healthcare
  labels:
    app: naweji-healthcare
data:
  healthcare.conf: |
    # Healthcare Services Configuration
    LOG_LEVEL=info
    FHIR_VERSION=R4
    HIPAA_AUDIT_LOG_ENABLED=true
    HIPAA_ENCRYPTION_ENABLED=true
    PHI_MASKING_ENABLED=true
    EHR_DATABASE_HOST=ehr-db.nrp-healthcare.svc.cluster.local
    EHR_DATABASE_PORT=5432
    CLINICAL_MODEL_VERSION=v1
    METRICS_ENABLED=true
    PROMETHEUS_PORT=8080
  hl7-mappings.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <hl7-mappings>
      <!-- HL7 to FHIR mapping configuration -->
      <segment name="MSH">
        <field name="1" fhir="MessageHeader.meta.versionId"/>
      </segment>
      <!-- Additional mappings -->
    </hl7-mappings>

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nrp-fintech-config
  namespace: nrp-fintech
  labels:
    app: naweji-fintech
data:
  fintech.conf: |
    # Fintech Services Configuration
    LOG_LEVEL=info
    PCI_DSS_ENABLED=true
    ENCRYPTION_AT_REST=true
    ENCRYPTION_IN_TRANSIT=true
    FRAUD_DETECTION_THRESHOLD=0.75
    FRAUD_MODEL_VERSION=v1
    PAYMENT_GATEWAY_TIMEOUT=30
    TRANSACTION_ENGINE_PORT=8080
    METRICS_ENABLED=true
    PROMETHEUS_PORT=8080
  fraud-rules.json: |
    {
      "rules": [
        {
          "id": "velocity-check",
          "type": "VELOCITY",
          "threshold": 5,
          "window_seconds": 60,
          "description": "Block if >5 transactions in 60 seconds"
        },
        {
          "id": "geographic-anomaly",
          "type": "GEOGRAPHIC",
          "enabled": true,
          "description": "Detect geographical anomalies"
        },
        {
          "id": "amount-threshold",
          "type": "AMOUNT",
          "threshold": 10000,
          "description": "Flag transactions over $10,000"
        }
      ]
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nrp-robotics-config
  namespace: nrp-robotics
  labels:
    app: naweji-robotics
data:
  robotics.conf: |
    # Robotics Services Configuration
    LOG_LEVEL=info
    GRPC_PORT=50051
    GRPC_MAX_CONCURRENT_STREAMS=100
    TELEMETRY_RESOLUTION_MS=100
    SAFETY_MONITORING_ENABLED=true
    METRICS_ENABLED=true
  kinematics.conf: |
    # Kinematics Configuration for Surgical Robots
    DOF=7
    JOINT_LIMITS_CHECK=true
    COLLISION_DETECTION=true
    MAX_LINEAR_VELOCITY=1.0
    MAX_ANGULAR_VELOCITY=2.0
