{{- if and .Values.enabled .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace.name }}
  labels:
    {{- if eq .Values.meshType "istio" }}
    istio-injection: enabled
    {{- else if eq .Values.meshType "linkerd" }}
    linkerd.io/inject: enabled
    {{- end }}
{{- end }}
