name: Deploy to EKS

#on:
  push:
    branches: [ "main" ]
    paths:
      - "k8s/**"
      - "helm/aiops/**"
      - ".github/workflows/deploy-to-eks.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      CLUSTER_NAME: t2s-eks-v6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${CLUSTER_NAME} --region ${AWS_REGION}
          kubectl get nodes

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Apply Express manifests
        run: |
          kubectl apply -f k8s/namespace-apps.yaml
          kubectl apply -f k8s/express-deployment.yaml
          kubectl apply -f k8s/express-service.yaml
          kubectl apply -f k8s/express-hpa.yaml

      - name: Deploy AIOps Helm chart
        run: |
          cd helm/aiops
          helm upgrade --install aiops . \
            --namespace aiops --create-namespace
