name: infra

on:
  push:
    branches: [main]
    paths: [".opa-version", "deploy/**", "security/**", "scripts/ci/**", "scripts/deploy.sh", "scripts/doctor.ps1", ".github/workflows/infra.yml"]
  pull_request:
    paths: [".opa-version", "deploy/**", "security/**", "scripts/ci/**", "scripts/deploy.sh", "scripts/doctor.ps1", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "1"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
  KUBECONFORM_VERSION: "0.6.7"

jobs:
  kubernetes:
    name: helm + manifests (kubeconform)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v
      - name: Read pinned OPA version
        id: opa
        run: echo "version=$(cat .opa-version)" >> "$GITHUB_OUTPUT"
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: ${{ steps.opa.outputs.version }}
      - name: Validate charts, overlays, manifests and OPA policies
        run: SKIP_TERRAFORM=1 scripts/ci/validate-infra.sh

  opa-workstations:
    name: opa on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned OPA version
        id: opa
        run: '"version=$((Get-Content .opa-version -Raw).Trim())" >> $env:GITHUB_OUTPUT'
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: ${{ steps.opa.outputs.version }}
      - name: Policy check + tests
        run: |
          opa check --strict security/policies/opa
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          opa test security/policies/opa
      - name: Doctor reports the pinned OPA
        if: runner.os == 'Windows'
        run: |
          $out = pwsh -NoProfile -File scripts/doctor.ps1 | Out-String
          $out
          # Match "<mark> opa <version>" with nothing after it (a mismatch adds "(repo pins ...)").
          if ($out -notmatch "(?m)^\s*\S+ opa $([regex]::Escape((Get-Content .opa-version -Raw).Trim()))\s*$") { exit 1 }

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false
      - name: Cache provider plugins
        uses: actions/cache@v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('deploy/terraform/**/*.tf') }}
          restore-keys: tf-plugins-${{ runner.os }}-
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - name: fmt
        run: terraform fmt -check -recursive -diff deploy/terraform
      - name: validate every module and environment
        run: SKIP_KUBERNETES=1 scripts/ci/validate-infra.sh
