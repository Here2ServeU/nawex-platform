name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly, catches newly published CVEs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks — current tree
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --no-git --no-banner --redact -v -c /repo/.gitleaks.toml
      - name: gitleaks — commits introduced by this change
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Scope to new commits: historical findings must be fixed by rotating the credential, not by CI.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            range="-1"
          else
            range="${BASE}..${GITHUB_SHA}"
          fi
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --no-banner --redact -v -c /repo/.gitleaks.toml --log-opts="$range"

  trivy:
    name: trivy (deps + IaC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Filesystem vulnerabilities & IaC misconfigurations (SARIF)
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.74.0 fs \
            --scanners vuln,misconfig --severity CRITICAL,HIGH --ignore-unfixed --no-progress --helm-kube-version 1.30.0 \
            --skip-dirs node_modules --ignorefile .trivyignore.yaml --format sarif --output trivy.sarif .
      - name: Fail on critical vulnerabilities
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.74.0 fs \
            --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress --skip-dirs node_modules \
            --ignorefile .trivyignore.yaml .
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy

  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python -m pip install pip-audit
          python -m pip install .   # non-editable so pip-audit can resolve every distribution
          pip-audit --progress-spinner off   # fails on any known vulnerability; skips only this unpublished package
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: npm audit
        run: |
          for app in apps/client-portal apps/workload; do npm --prefix "$app" audit --omit=dev --audit-level=high; done

  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: codeql-${{ matrix.language }}
