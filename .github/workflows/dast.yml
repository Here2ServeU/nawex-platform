name: dast

# Dynamic application security testing with OWASP ZAP against the running API
# (docker compose `api` service on :8000):
#   * baseline scan  - passive spider of the app
#   * API scan       - active scan driven by the OpenAPI document (/openapi.json)
# Fails only on High-risk alerts; full reports are uploaded as artifacts.
# Runs weekly, on demand, and on pull requests labelled `dast`.

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: dast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap:
    name: ZAP baseline + API scan
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'dast')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TARGET: http://localhost:8000
      # Ephemeral local stack: dry-run autonomy, kill switch on, auth disabled so
      # the scanners can reach every route (never a production configuration).
      GOLDEN_AUTONOMY_MODE: dry_run
      GOLDEN_KILL_SWITCH: "true"
      GOLDEN_API_KEYS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the API
        run: |
          docker compose build api
          docker compose up -d api

      - name: Wait for /health
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS "${TARGET}/health" >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs api
          exit 1

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ env.TARGET }}
          cmd_options: "-a"
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline

      - name: Keep baseline report
        if: always()
        run: mkdir -p zap/baseline && mv report_* zap/baseline/ 2>/dev/null || true

      - name: ZAP API scan (OpenAPI)
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          target: ${{ env.TARGET }}/openapi.json
          format: openapi
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-api

      - name: Keep API scan report
        if: always()
        run: mkdir -p zap/api && mv report_* zap/api/ 2>/dev/null || true

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: zap/
          if-no-files-found: warn

      - name: Fail on High-risk alerts
        run: |
          set -euo pipefail
          high=0
          for report in zap/baseline/report_json.json zap/api/report_json.json; do
            if [[ ! -s "$report" ]]; then
              echo "::error::missing ZAP report $report"
              exit 1
            fi
            n="$(jq '[.site[]?.alerts[]? | select(.riskcode == "3")] | length' "$report")"
            jq -r '.site[]?.alerts[]? | select(.riskcode == "3") | "::error title=ZAP High::\(.name) (\(.count // "?") instances)"' "$report"
            echo "$(dirname "$report"): ${n} High alert(s)" >> "$GITHUB_STEP_SUMMARY"
            high=$((high + n))
          done
          if (( high > 0 )); then
            echo "::error::${high} High-risk ZAP alert(s); see the zap-reports artifact"
            exit 1
          fi

      - name: Stop the stack
        if: always()
        run: docker compose down -v
