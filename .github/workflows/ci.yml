name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (CPU-only torch keeps CI fast; GPU wheels are used on GPU runners)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,ml,robotics]'

      - name: Lint
        run: |
          ruff check src tests --output-format=github
          ruff format --check src tests

      - name: Type check
        run: mypy

      - name: Generated gRPC code is up to date
        run: |
          mkdir -p /tmp/gen
          python -m grpc_tools.protoc -Iproto --python_out=/tmp/gen --grpc_python_out=/tmp/gen proto/surgical_telemetry.proto
          diff -q <(grep -v 'Protobuf Python Version' /tmp/gen/surgical_telemetry_pb2.py) \
                  <(grep -v 'Protobuf Python Version' src/golden/robotics/grpc/generated/surgical_telemetry_pb2.py) \
            || echo "::warning::gRPC stubs differ from proto/ — run 'make proto'"

      - name: Test
        run: pytest --cov --cov-report=term --cov-report=xml --junitxml=junit.xml

      - name: CLI smoke test
        run: |
          golden --version
          golden config show > /dev/null
          golden roi --vertical migration
          golden migrate manifests --output /tmp/waves
          golden gpu analyze --scenario hot > /dev/null
          golden demo client --vertical all --client "CI" --fast --output /tmp/demo > /dev/null
          golden demo engine --epochs 1 --output-dir /tmp/engine > /dev/null
          golden iam model > /dev/null
          golden iam multicloud > /dev/null
          golden network verify > /dev/null
          golden finops report > /dev/null
          golden db explain --scenario healthy > /dev/null
          golden migrate portfolio > /dev/null
          golden features demo > /dev/null

      - name: Agent-ops gates (cost controls proven, red-team, model quality)
        env:
          GOLDEN_AGENTOPS_DIR: /tmp/agentops
        run: |
          golden agent verify > /tmp/agent-verify.json
          golden agent redteam > /tmp/redteam.json
          golden model retrain --force --registry /tmp/registry > /tmp/retrain.json
          golden rag ask "How long are PHI audit logs retained?" > /dev/null

      - uses: actions/upload-artifact@v7
        if: always() && matrix.python == '3.12'
        with:
          name: python-test-results
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: ignore

  node:
    name: node ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [client-portal, workload]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  scripts-and-config:
    name: shell, compose & config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: |
          # Terraform templatefile() scripts (deploy/terraform) use ${var} interpolation, not shell vars.
          mapfile -t scripts < <(git ls-files '*.sh' ':!:deploy/terraform/**')
          shellcheck -S warning "${scripts[@]}"

      - name: Docker Compose files are valid
        run: |
          docker compose config -q
          docker compose --profile robotics config -q
          docker compose -f observability/docker-compose.yml config -q

      - name: YAML & JSON parse
        run: python3 scripts/ci/check-yaml-json.py

      - name: Ansible baseline (syntax + ansible-lint production profile)
        working-directory: deploy/ansible
        run: |
          python3 -m pip install --quiet ansible-core ansible-lint
          ansible-galaxy collection install -r requirements.yml > /dev/null
          ANSIBLE_CONFIG=ansible.cfg ansible-playbook --syntax-check playbooks/baseline.yml
          ANSIBLE_CONFIG=ansible.cfg ansible-lint playbooks/baseline.yml roles/

      - name: Template rebrand works end to end
        run: |
          git config --global user.email ci@example.com && git config --global user.name ci
          work="$(mktemp -d)" && git clone -q . "$work/repo" && cd "$work/repo"
          scripts/init-project.sh acme "Acme Platform"
          if grep -rIl --exclude-dir=.git -E '\bgolden\b|GOLDEN_' src tests compose.yaml Makefile pyproject.toml; then
            echo "::error::files above still reference 'golden' after rebrand"; exit 1
          fi
          python3 -m venv .venv && .venv/bin/pip install -q -e '.[dev]'
          .venv/bin/acme config get project.name
          .venv/bin/pytest -q -x --ignore=tests/test_models.py --ignore=tests/robotics -p no:cacheprovider
