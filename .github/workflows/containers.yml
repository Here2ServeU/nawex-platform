name: containers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: golden-platform
            context: .
          - image: golden-client-portal
            context: apps/client-portal
          - image: golden-workload
            context: apps/workload
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Lowercase registry
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (load locally for scanning)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Smoke test
        run: |
          set -euo pipefail
          case "${{ matrix.image }}" in
            golden-platform)
              docker run --rm golden-platform:scan --version
              cid=$(docker run -d -e PORT=8000 -p 8000:8000 golden-platform:scan serve api)
              port=8000 ;;
            golden-client-portal) cid=$(docker run -d -p 3001:3001 golden-client-portal:scan); port=3001 ;;
            golden-workload)      cid=$(docker run -d -p 8080:8080 golden-workload:scan); port=8080 ;;
          esac
          for _ in $(seq 1 30); do curl -fsS "http://127.0.0.1:${port}/health" && break; sleep 1; done
          curl -fsS "http://127.0.0.1:${port}/health"
          test "$(docker inspect -f '{{.Config.User}}' "$cid")" != ""   # never runs as root
          docker rm -f "$cid"

      - name: Vulnerability scan (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0 \
            image --exit-code 1 --ignore-unfixed --severity CRITICAL --no-progress ${{ matrix.image }}:scan

      - name: Push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          provenance: true
          sbom: true

  # Keyless signing (Sigstore Fulcio + Rekor) of every pushed image, by digest,
  # plus an SPDX SBOM attestation. The signing identity is this workflow's
  # GitHub OIDC token; security/policies/kyverno/verify-images.yaml admits only
  # images signed by it. id-token: write is granted to this job alone.
  sign:
    name: sign ${{ matrix.image }}
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [golden-platform, golden-client-portal, golden-workload]
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      # Identity Kyverno and `cosign verify` expect (main or v* tags).
      CERT_IDENTITY_REGEXP: ^https://github\.com/${{ github.repository }}/\.github/workflows/containers\.yml@refs/(heads/main|tags/v.+)$
    steps:
      # cosign v2.x keeps the classic .sig/.att tag layout Kyverno verifyImages reads.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve pushed digest
        id: ref
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          repo="${REGISTRY,,}/${IMAGE_NAME}"
          # docker/metadata-action `type=sha,format=short` tag from the build job.
          digest="$(docker buildx imagetools inspect "${repo}:sha-${GITHUB_SHA::7}" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" == sha256:* ]] || { echo "could not resolve digest for ${repo}" >&2; exit 1; }
          echo "image=${repo}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign (keyless, by digest)
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: cosign sign --yes "$IMAGE"

      - name: Attest SBOM (SPDX from the BuildKit attestation)
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE" --format '{{ json .SBOM.SPDX }}' > sbom.spdx.json
          jq -e '.spdxVersion' sbom.spdx.json >/dev/null
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE"

      - name: Verify signature and attestation
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          set -euo pipefail
          cosign verify "$IMAGE" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$CERT_IDENTITY_REGEXP" >/dev/null
          cosign verify-attestation "$IMAGE" --type spdxjson \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$CERT_IDENTITY_REGEXP" >/dev/null
          echo "verified: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
