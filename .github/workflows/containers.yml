name: containers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: golden-platform
            context: .
          - image: golden-client-portal
            context: apps/client-portal
          - image: golden-workload
            context: apps/workload
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Lowercase registry
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (load locally for scanning)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Smoke test
        run: |
          set -euo pipefail
          case "${{ matrix.image }}" in
            golden-platform)
              docker run --rm golden-platform:scan --version
              cid=$(docker run -d -e PORT=8000 -p 8000:8000 golden-platform:scan serve api)
              port=8000 ;;
            golden-client-portal) cid=$(docker run -d -p 3001:3001 golden-client-portal:scan); port=3001 ;;
            golden-workload)      cid=$(docker run -d -p 8080:8080 golden-workload:scan); port=8080 ;;
          esac
          for _ in $(seq 1 30); do curl -fsS "http://127.0.0.1:${port}/health" && break; sleep 1; done
          curl -fsS "http://127.0.0.1:${port}/health"
          test "$(docker inspect -f '{{.Config.User}}' "$cid")" != ""   # never runs as root
          docker rm -f "$cid"

      - name: Vulnerability scan (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0 \
            image --exit-code 1 --ignore-unfixed --severity CRITICAL --no-progress ${{ matrix.image }}:scan

      - name: Push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          provenance: true
          sbom: true
