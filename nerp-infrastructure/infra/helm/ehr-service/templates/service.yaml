apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ehr-service
  namespace: healthcare
  labels:
    app: ehr-service
    compliance: hipaa
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8093
      protocol: TCP
      name: http
  selector:
    app: ehr-service
