apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "splunk-hec.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "splunk-hec.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "splunk-hec.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "splunk-hec.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: splunk
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SPLUNK_START_ARGS
              value: "--accept-license"
            - name: SPLUNK_HEC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "splunk-hec.fullname" . }}-hec
                  key: hec_token
            - name: SPLUNK_HEC_PORT
              value: "{{ .Values.hec.port }}"
            - name: SPLUNK_HTTP_ENABLESSL
              value: "{{ ternary "true" "false" .Values.hec.ssl }}"
          ports:
            - name: hec
              containerPort: {{ .Values.hec.port }}
