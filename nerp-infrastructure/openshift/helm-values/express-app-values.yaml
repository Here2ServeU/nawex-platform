# OpenShift-specific Helm values for Express Web App
replicaCount: 2

image:
  repository: here2serveu/express-t2s-app-v7
  tag: "latest"
  pullPolicy: IfNotPresent

# OpenShift Route configuration (instead of standard Ingress)
route:
  enabled: true
  hostname: "" # Will be auto-generated by OpenShift
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

# Kubernetes Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# Pod security settings for OpenShift
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

# Resource management
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

# Horizontal Pod Autoscaling
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Health checks
livenessProbe:
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Environment variables
env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "3000"
  - name: LOG_LEVEL
    value: "info"

# Pod anti-affinity to spread across nodes
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - express-web-app
          topologyKey: kubernetes.io/hostname

# OpenShift-specific service account
serviceAccountName: nrp-platform-sa

# Labels and annotations
podLabels:
  app: express-web-app
  platform: openshift

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/metrics"
