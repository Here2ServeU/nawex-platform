apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: express-app-pdb
  namespace: nrp-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: express-web-app
  unhealthyPodEvictionPolicy: IfHealthyBudget

