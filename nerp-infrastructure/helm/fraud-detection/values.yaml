# Fraud Detection Service - Helm Values
replicaCount: 3

image:
  repository: express-reliability/fraud-detector
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8091

ingress:
  enabled: false

resources:
  limits:
    cpu: "1000m"
    memory: "2Gi"
  requests:
    cpu: "500m"
    memory: "1Gi"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

# Fraud detection configuration
config:
  fraudThreshold: "0.85"
  modelPath: "/models/fraud_detector_v1.h5"
  scoringTimeoutMs: 50
  kafkaBroker: "kafka:9092"
  kafkaTopicInput: "transactions.raw"
  kafkaTopicOutput: "transactions.scored"
  redisUrl: "redis://fintech-redis:6379"

# PCI-DSS compliance settings
security:
  networkPolicy:
    enabled: true
    allowedNamespaces:
      - fintech
      - monitoring
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false

# Health checks with strict SLO enforcement
livenessProbe:
  httpGet:
    path: /health
    port: 8091
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8091
  initialDelaySeconds: 5
  periodSeconds: 3
  failureThreshold: 2

# Pod disruption budget for high availability
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Topology spread for multi-AZ resilience
topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
