enabled: true

meshType: istio  # istio | linkerd

namespace:
  name: apps
  create: true

istio:
  gatewayName: express-gateway
  gatewayNamespace: istio-system
  host: express.example.com
  port: 80
  tls:
    enabled: false
    credentialName: ""

linkerd:
  serviceProfile:
    enabled: true
    serviceName: "express-app.apps.svc.cluster.local"
