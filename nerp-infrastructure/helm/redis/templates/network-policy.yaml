apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-isolation-policy
  namespace: {{ .Values.worker.namespace | default "ai-worker-isolated" }}
spec:
  podSelector:
    matchLabels:
      component: ai-worker
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          # Only allow traffic from your Express app namespace
          name: {{ .Values.app.namespace }}
