apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-clinical-gateway
  namespace: healthcare
  labels:
    app: clinical-gateway
    compliance: hipaa
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: clinical-gateway
  template:
    metadata:
      labels:
        app: clinical-gateway
        compliance: hipaa
        phi-access: "true"
    spec:
      securityContext:
        {{- toYaml .Values.security.podSecurityContext | nindent 8 }}
      containers:
        - name: clinical-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8095
          env:
            - name: PORT
              value: "8095"
            - name: FHIR_VERSION
              value: {{ .Values.config.fhirVersion | quote }}
            - name: CONSENT_VERIFICATION
              value: {{ .Values.config.consentVerificationEnabled | quote }}
            - name: KAFKA_BROKER
              value: {{ .Values.config.kafkaBroker | quote }}
            - name: REDIS_URL
              value: {{ .Values.config.redisUrl | quote }}
          securityContext:
            {{- toYaml .Values.security.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
