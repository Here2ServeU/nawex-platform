# Golden platform alerts — service availability, HTTP golden signals and
# per-vertical domain alerts. Metric names follow the golden-path contract
# exposed by every `golden serve <service>` process:
#   golden_http_requests_total{service,method,path,status}
#   golden_http_request_duration_seconds_bucket{service,method,path,le}
# AI-safety and GPU alerts live in ai_safety_rules.yml / gpu_rules.yml.
groups:
  # ── Service Availability ──────────────────────────────────────────────────────
  - name: golden_availability
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up{job=~"platform-api|fintech|healthcare|gpu|migration|apps"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Target {{ $labels.instance }} ({{ $labels.job }}) is down"
          description: "{{ $labels.instance }} in job {{ $labels.job }} has been unreachable for more than 1 minute."

      - alert: HighErrorRate
        expr: |
          sum by (job, vertical, service) (rate(golden_http_requests_total{status=~"5.."}[5m]))
          / sum by (job, vertical, service) (rate(golden_http_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on {{ $labels.service }}"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (job, vertical, service, le) (rate(golden_http_request_duration_seconds_bucket[5m]))
          ) > 2.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on {{ $labels.service }}"
          description: "p95 latency is {{ $value }}s (threshold: 2s)."

  # ── Fintech Alerts ────────────────────────────────────────────────────────────
  - name: golden_fintech
    interval: 30s
    rules:
      - alert: FraudDetectionDown
        expr: up{job="fintech", instance=~"fraud-detector:.*"} == 0
        for: 30s
        labels:
          severity: critical
          vertical: fintech
        annotations:
          summary: "Fraud detection service is down"
          description: "fraud-detector has been unreachable for 30s. Transactions may be unscreened."

      - alert: HighFraudScore
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(golden_fraud_score_bucket[5m]))
          ) > 0.8
        for: 5m
        labels:
          severity: warning
          vertical: fintech
        annotations:
          summary: "Elevated fraud scores detected"
          description: "p95 fraud score is {{ $value }} (threshold: 0.8)."

      - alert: TransactionFailureRateHigh
        expr: |
          sum(rate(golden_transactions_total{status=~"failed|error"}[5m]))
          / sum(rate(golden_transactions_total[5m])) > 0.05
        for: 3m
        labels:
          severity: warning
          vertical: fintech
        annotations:
          summary: "Transaction failure rate above 5%"
          description: "{{ $value | humanizePercentage }} of transactions failed over the last 5 minutes."

      - alert: PaymentGatewayLatencyHigh
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(golden_http_request_duration_seconds_bucket{service="payment-gateway"}[5m]))
          ) > 5.0
        for: 2m
        labels:
          severity: critical
          vertical: fintech
        annotations:
          summary: "Payment gateway p99 latency > 5s"
          description: "p99 payment gateway latency is {{ $value }}s."

  # ── Healthcare Alerts ─────────────────────────────────────────────────────────
  - name: golden_healthcare
    interval: 30s
    rules:
      - alert: EHRIngestionDown
        expr: up{job="healthcare", instance=~"ehr-ingestion:.*"} == 0
        for: 30s
        labels:
          severity: critical
          vertical: healthcare
        annotations:
          summary: "EHR ingestion service is down"
          description: "EHR ingestion has been unreachable for 30s. Patient records may be delayed."

      - alert: ClinicalDecisionServiceDown
        expr: up{job="healthcare", instance=~"clinical-decision:.*"} == 0
        for: 30s
        labels:
          severity: critical
          vertical: healthcare
        annotations:
          summary: "Clinical decision support is down"
          description: "Clinical decision service is unavailable for 30s."

      - alert: EHRIngestionRejectRateHigh
        expr: |
          sum(rate(golden_ehr_records_total{status=~"rejected|failed|error"}[5m]))
          / sum(rate(golden_ehr_records_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          vertical: healthcare
        annotations:
          summary: "EHR ingestion reject rate above 5%"
          description: "{{ $value | humanizePercentage }} of EHR records were rejected or failed."

      - alert: HighPHIRiskScore
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(golden_phi_risk_score_bucket[5m]))
          ) > 0.7
        for: 5m
        labels:
          severity: warning
          vertical: healthcare
        annotations:
          summary: "Elevated PHI exposure risk"
          description: "p95 PHI risk score is {{ $value }} (threshold: 0.7). No PHI is included in this alert."

  # ── Infrastructure Alerts ─────────────────────────────────────────────────────
  - name: golden_infrastructure
    interval: 30s
    rules:
      - alert: KafkaBrokerDown
        expr: up{job="kafka"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kafka broker is unreachable"
          description: "Kafka broker has been down for 1 minute."

      - alert: KafkaConsumerLag
        expr: kafka_consumer_group_lag > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag is high"
          description: "Consumer group {{ $labels.consumergroup }} lag is {{ $value }}."

      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage > 85%"
          description: "Redis instance {{ $labels.instance }} memory is at {{ $value | humanizePercentage }}."

      - alert: HighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}% (threshold: 85%)."

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk space critically low on {{ $labels.instance }}"
          description: "Available disk space is {{ $value }}%."
