apiVersion: 1

providers:
  - name: Golden Dashboards
    orgId: 1
    folder: Golden Platform
    folderUid: golden-platform
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: true
