server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: golden
    batchwait: 1s
    batchsize: 1048576
    timeout: 10s
    backoff_config:
      min_period: 100ms
      max_period: 5s
      max_retries: 10

scrape_configs:
  # ── Fintech Services ─────────────────────────────────────────
  - job_name: fintech-transaction-engine
    static_configs:
      - targets: ["localhost"]
        labels:
          job: fintech-transaction-engine
          vertical: fintech
          __path__: /var/log/golden/fintech/transaction-engine/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: message
            trace_id: traceID
            service: service
      - labels:
          level:
          trace_id:
      - output:
          source: msg

  - job_name: fintech-fraud-detector
    static_configs:
      - targets: ["localhost"]
        labels:
          job: fintech-fraud-detector
          vertical: fintech
          __path__: /var/log/golden/fintech/fraud-detector/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: message
            trace_id: traceID
      - labels:
          level:
          trace_id:

  - job_name: fintech-payment-gateway
    static_configs:
      - targets: ["localhost"]
        labels:
          job: fintech-payment-gateway
          vertical: fintech
          __path__: /var/log/golden/fintech/payment-gateway/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: message
            trace_id: traceID
      - labels:
          level:
          trace_id:

  # ── Healthcare Services ───────────────────────────────────────
  - job_name: healthcare-ehr-ingestion
    static_configs:
      - targets: ["localhost"]
        labels:
          job: healthcare-ehr-ingestion
          vertical: healthcare
          __path__: /var/log/golden/healthcare/ehr-ingestion/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: message
            trace_id: traceID
      - labels:
          level:
          trace_id:
      # Mask any PHI-like fields before shipping
      - replace:
          expression: '(?i)(patient_id|ssn|dob|mrn)=\S+'
          replace: '${1}=REDACTED'

  - job_name: healthcare-clinical-decision
    static_configs:
      - targets: ["localhost"]
        labels:
          job: healthcare-clinical-decision
          vertical: healthcare
          __path__: /var/log/golden/healthcare/clinical-decision/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: message
            trace_id: traceID
      - labels:
          level:
          trace_id:
      - replace:
          expression: '(?i)(patient_id|ssn|dob|mrn)=\S+'
          replace: '${1}=REDACTED'

  - job_name: healthcare-patient-gateway
    static_configs:
      - targets: ["localhost"]
        labels:
          job: healthcare-patient-gateway
          vertical: healthcare
          __path__: /var/log/golden/healthcare/patient-gateway/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: message
            trace_id: traceID
      - labels:
          level:
          trace_id:
      - replace:
          expression: '(?i)(patient_id|ssn|dob|mrn)=\S+'
          replace: '${1}=REDACTED'

  # ── Core API ─────────────────────────────────────────────────
  - job_name: golden-api
    static_configs:
      - targets: ["localhost"]
        labels:
          job: golden-api
          vertical: core
          __path__: /var/log/golden/api/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: message
            trace_id: traceID
      - labels:
          level:
          trace_id:

  # ── Docker container logs (catch-all) ────────────────────────
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: message
      - labels:
          level:
