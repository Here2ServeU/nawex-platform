# Golden observability stack: Prometheus, Alertmanager, Grafana, Loki,
# Promtail, Tempo (+ optional DCGM exporter under the `gpu` profile).
#
#   docker compose up -d                                   # app stack (repo root)
#   docker compose -f observability/docker-compose.yml up -d
#
# All bind-mount paths are relative to this folder.
services:
  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: golden_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/metrics_config.yaml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    networks:
      - observability
      - golden-net

  # ── Alertmanager ───────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: golden_alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alerting/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alerting/templates:/etc/alertmanager/templates:ro
      # Secret files: smtp_password, slack_webhook_url, pagerduty_routing_key
      - ./alerting/secrets:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost:9093
    networks:
      - observability

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: golden_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-golden-admin}
      - GF_SECURITY_SECRET_KEY=${GF_SECURITY_SECRET_KEY:-golden-secret-change-me}
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - observability

  # ── Loki ───────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: golden_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yaml
    networks:
      - observability
      - golden-net

  # ── Promtail ───────────────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:3.0.0
    container_name: golden_promtail
    restart: unless-stopped
    volumes:
      - ./loki/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/log/golden:/var/log/golden:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    networks:
      - observability
      - golden-net

  # ── Tempo ──────────────────────────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.4.1
    container_name: golden_tempo
    restart: unless-stopped
    ports:
      - "3200:3200" # Tempo HTTP API
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "14268:14268" # Jaeger HTTP
      - "9411:9411" # Zipkin
    volumes:
      - ./tempo/tempo-config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    command: -config.file=/etc/tempo/config.yaml
    networks:
      - observability
      - golden-net

  # ── NVIDIA DCGM exporter (only on hosts with NVIDIA GPUs) ─────────────────
  # docker compose -f observability/docker-compose.yml --profile gpu up -d
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.1-ubuntu22.04
    container_name: golden_dcgm_exporter
    profiles: ["gpu"]
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    ports:
      - "9400:9400"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - observability
      - golden-net

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  tempo-data:

networks:
  observability:
    name: golden_observability
  # The application stack network created by the root compose.yaml
  # (`docker compose up` at repo root). Override with GOLDEN_NETWORK if the
  # project name differs. Prometheus resolves api, transaction-engine, ...
  # gpu-optimizer by their compose service names on this network.
  golden-net:
    external: true
    name: ${GOLDEN_NETWORK:-golden-platform_default}
