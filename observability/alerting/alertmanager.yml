global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.example.com:587"
  smtp_from: "alerts@golden-platform.example"
  smtp_auth_username: "alerts@golden-platform.example"
  # Secrets are read from files (Alertmanager does not expand env vars).
  # Mounted from observability/alerting/secrets/ — see alerting/README.md.
  smtp_auth_password_file: /etc/alertmanager/secrets/smtp_password
  slack_api_url_file: /etc/alertmanager/secrets/slack_webhook_url
  pagerduty_url: "https://events.pagerduty.com/v2/enqueue"

templates:
  - "/etc/alertmanager/templates/*.tmpl"

# ── Routing Tree ──────────────────────────────────────────────────────────────
route:
  group_by: ["alertname", "job", "vertical"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: slack-default

  routes:
    # Critical alerts → PagerDuty (immediate on-call)
    - match:
        severity: critical
      receiver: pagerduty-critical
      group_wait: 10s
      repeat_interval: 1h
      continue: true   # also notify slack

    # Fintech vertical alerts
    - match:
        vertical: fintech
      receiver: slack-fintech
      group_by: ["alertname", "job"]

    # Healthcare vertical alerts (HIPAA-aware: no PHI in notifications)
    - match:
        vertical: healthcare
      receiver: slack-healthcare
      group_by: ["alertname", "job"]

    # GPU / AI-infrastructure fleet alerts
    - match:
        vertical: gpu
      receiver: slack-gpu
      group_by: ["alertname", "node"]

    # Modernization / VM migration alerts (cutover war-room channel)
    - match:
        vertical: migration
      receiver: slack-migration
      group_by: ["alertname", "wave"]

    # AI-safety alerts (kill switch, guardrails, blocked actions, rate limiting)
    - match:
        domain: ai-safety
      receiver: slack-ai-safety
      group_by: ["alertname", "service"]

    # SLO breach alerts
    - match:
        slo: error_budget
      receiver: slo-channel

    # Default catch-all: Slack general
    - match_re:
        severity: "warning|info"
      receiver: slack-default

# ── Inhibition Rules ──────────────────────────────────────────────────────────
inhibit_rules:
  # If a service is completely down, suppress its latency/error-rate warnings
  - source_match:
      alertname: ServiceDown
    target_match_re:
      alertname: "(HighErrorRate|HighLatency)"
    equal: ["job"]

  # If Kafka is down, suppress consumer lag warnings
  - source_match:
      alertname: KafkaBrokerDown
    target_match:
      alertname: KafkaConsumerLag

# ── Receivers ─────────────────────────────────────────────────────────────────
receivers:
  - name: slack-default
    slack_configs:
      - channel: "#golden-alerts"
        send_resolved: true
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Job:* {{ .Labels.job }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  - name: slack-fintech
    slack_configs:
      - channel: "#golden-fintech-alerts"
        send_resolved: true
        title: '[FINTECH {{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  - name: slack-healthcare
    slack_configs:
      - channel: "#golden-healthcare-alerts"
        send_resolved: true
        title: '[HEALTHCARE {{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Severity:* {{ .Labels.severity }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  - name: slack-gpu
    slack_configs:
      - channel: "#golden-gpu-alerts"
        send_resolved: true
        title: '[GPU {{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'

  - name: slack-migration
    slack_configs:
      - channel: "#golden-migration-cutover"
        send_resolved: true
        title: '[MIGRATION {{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ if .Annotations.runbook }}*Runbook:* {{ .Annotations.runbook }}{{ end }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  - name: slack-ai-safety
    slack_configs:
      - channel: "#golden-ai-safety"
        send_resolved: true
        title: '[AI-SAFETY {{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty_routing_key
        description: "{{ .CommonLabels.alertname }}: {{ .CommonAnnotations.summary }}"
        severity: "{{ .CommonLabels.severity }}"
        details:
          platform: golden
          environment: production
          job: "{{ .CommonLabels.job }}"

  - name: slo-channel
    slack_configs:
      - channel: "#golden-slo-burn"
        send_resolved: true
        title: '[SLO {{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *SLO Breach:* {{ .Annotations.summary }}
          *Detail:* {{ .Annotations.description }}
          {{ end }}
        color: 'danger'
    email_configs:
      - to: "sre-team@golden-platform.example"
        send_resolved: true
        headers:
          Subject: "[SLO] {{ .CommonLabels.alertname }} — {{ .Status | toUpper }}"
        text: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          {{ end }}
