apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: nrp-scc
  annotations:
    description: "Security Context Constraints for Naweji Reliability Platform - allows privileged operations for AI/ML workloads"
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegedContainer: false
allowedCapabilities:
  - NET_BIND_SERVICE
  - SYS_RESOURCE
  - SYS_PTRACE
defaultAddCapabilities: []
forbiddenSyscalls: []
fsGroup:
  type: RunAsAny
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - MKNOD
  - SYS_CHROOT
runAsUser:
  type: MustRunAsRange
  uidRangeMin: 1000
  uidRangeMax: 65535
seLinuxContext:
  type: MustRunAs
  seLinuxOptions:
    level: "s0:c123,c456"
supplementalGroups:
  type: RunAsAny
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
  - serviceAccountToken
  - hostPath
priority: 10

---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: nrp-privileged-scc
  annotations:
    description: "Privileged SCC for robotics and edge control workloads requiring real-time capabilities"
allowHostDirVolumePlugin: true
allowHostIPC: true
allowHostNetwork: true
allowHostPID: true
allowHostPorts: true
allowPrivilegedContainer: true
allowedCapabilities:
  - "*"
defaultAddCapabilities: []
forbiddenSyscalls: []
fsGroup:
  type: RunAsAny
readOnlyRootFilesystem: false
requiredDropCapabilities: []
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
volumes:
  - "*"
priority: 0
