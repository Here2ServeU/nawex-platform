apiVersion: v1
kind: ServiceAccount
metadata:
  name: nrp-platform-sa
  namespace: nrp-platform
  labels:
    app: naweji-reliability-platform
  annotations:
    description: "Service account for Naweji Reliability Platform core services"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nrp-healthcare-sa
  namespace: nrp-healthcare
  labels:
    app: naweji-healthcare
  annotations:
    description: "Service account for Healthcare services with HIPAA compliance"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nrp-fintech-sa
  namespace: nrp-fintech
  labels:
    app: naweji-fintech
  annotations:
    description: "Service account for Fintech services with PCI-DSS compliance"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nrp-robotics-sa
  namespace: nrp-robotics
  labels:
    app: naweji-robotics
  annotations:
    description: "Service account for Robotics and edge control services"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nrp-platform-role
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nrp-platform-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nrp-platform-role
subjects:
  - kind: ServiceAccount
    name: nrp-platform-sa
    namespace: nrp-platform
  - kind: ServiceAccount
    name: nrp-healthcare-sa
    namespace: nrp-healthcare
  - kind: ServiceAccount
    name: nrp-fintech-sa
    namespace: nrp-fintech
  - kind: ServiceAccount
    name: nrp-robotics-sa
    namespace: nrp-robotics

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nrp-pod-reader
  namespace: nrp-platform
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nrp-pod-reader-binding
  namespace: nrp-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nrp-pod-reader
subjects:
  - kind: ServiceAccount
    name: nrp-platform-sa
    namespace: nrp-platform
