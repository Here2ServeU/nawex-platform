apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nrp-platform-netpol
  namespace: nrp-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from OpenShift router (ingress controller)
    - from:
        - namespaceSelector:
            matchLabels:
              name: openshift-ingress
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 8080
    # Allow inter-pod communication within namespace
    - from:
        - podSelector: {}
  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchNames:
              - openshift-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow egress to other NRP namespaces
    - to:
        - namespaceSelector:
            matchLabels:
              app: naweji-reliability-platform
      ports:
        - protocol: TCP
          port: 9092 # Kafka
    # Allow egress to Kubernetes API
    - to:
        - namespaceSelector: {}
        - podSelector:
            matchLabels:
              component: kube-apiserver
      ports:
        - protocol: TCP
          port: 443

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nrp-healthcare-netpol
  namespace: nrp-healthcare
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from OpenShift router
    - from:
        - namespaceSelector:
            matchLabels:
              name: openshift-ingress
      ports:
        - protocol: TCP
          port: 8080
    # Allow from nrp-platform for inter-service communication
    - from:
        - namespaceSelector:
            matchLabels:
              name: nrp-platform
    # Allow intra-namespace traffic
    - from:
        - podSelector: {}
  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              name: openshift-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow to nrp-platform (Kafka, etc.)
    - to:
        - namespaceSelector:
            matchLabels:
              name: nrp-platform
    # Allow to external (if needed for data sharing)
    - to:
        - podSelector: {}

