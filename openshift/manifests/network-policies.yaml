        - podSelector: {}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nrp-robotics-netpol
  namespace: nrp-robotics
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # gRPC communication
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 50051
    # Intra-namespace
    - from:
        - podSelector: {}
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              name: openshift-dns
      ports:
        - protocol: UDP
          port: 53
    # To other namespaces
    - to:
        - namespaceSelector:
            matchLabels:
              app: naweji-reliability-platform
    # Intra-namespace
    - to:
        - podSelector: {}
