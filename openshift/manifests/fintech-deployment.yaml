---
apiVersion: v1
kind: Service
metadata:
  name: fraud-detection-service
  namespace: nrp-fintech
  labels:
    app: fraud-detection-service
  annotations:
    description: "PCI-DSS compliant Fraud Detection Service"
spec:
  selector:
    app: fraud-detection-service
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080

---
apiVersion: v1
kind: Service
