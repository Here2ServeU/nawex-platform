apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: fraud-detection
  namespace: nrp-fintech
  labels:
    app: fraud-detection-service
spec:
  host: ""
  to:
    kind: Service
    name: fraud-detection-service
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

