            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-engine-service
  namespace: nrp-fintech
  labels:
    app: transaction-engine-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transaction-engine-service
  template:
    metadata:
      labels:
        app: transaction-engine-service
    spec:
      serviceAccountName: nrp-fintech-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: transaction-engine
          image: here2serveu/transaction-engine-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fintech-hpa
  namespace: nrp-fintech
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fraud-detection-service
  minReplicas: 2
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
