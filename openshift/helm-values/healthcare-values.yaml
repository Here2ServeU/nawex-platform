# OpenShift-specific Helm values for Healthcare Services
replicaCount: 2

# Healthcare service configuration
healthcare:
  ehrIngestion:
    image: here2serveu/ehr-ingestion-service:v1
    replicas: 2
    port: 8080
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

  clinicalDecision:
    image: here2serveu/clinical-decision-service:v1
    replicas: 2
    port: 8080
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 2Gi

  patientDataGateway:
    image: here2serveu/patient-data-gateway:v1
    replicas: 2
    port: 8080
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

# OpenShift Route configuration
routes:
  - name: ehr-ingestion
    service: ehr-ingestion-service
    port: 80
    tls:
      enabled: true
      termination: edge
  - name: clinical-decision
    service: clinical-decision-service
    port: 80
    tls:
      enabled: true
      termination: edge
  - name: patient-data-gateway
    service: patient-data-gateway
    port: 80
    tls:
      enabled: true
      termination: edge

# Pod security context (HIPAA compliant)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# HIPAA-specific environment variables
env:
  - name: LOG_LEVEL
    value: "info"
  - name: FHIR_VERSION
    value: "R4"
  - name: HIPAA_AUDIT_LOG_ENABLED
    value: "true"
  - name: HIPAA_ENCRYPTION_ENABLED
    value: "true"
  - name: PHI_MASKING_ENABLED
    value: "true"

# Autoscaling for healthcare services
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 85

# Service account for healthcare
serviceAccountName: nrp-healthcare-sa

# Network policies for compliance
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Labels
labels:
  app: nrp-healthcare
  compliance: hipaa
  platform: openshift

# Annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  compliance.openshift.io/hipaa: "true"
