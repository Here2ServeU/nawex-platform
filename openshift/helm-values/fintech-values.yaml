# OpenShift-specific Helm values for Fintech Services
replicaCount: 3

# Fintech service configuration
fintech:
  fraudDetection:
    image: here2serveu/fraud-detection-service:v1
    replicas: 3
    port: 8080
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 2Gi

  paymentGateway:
    image: here2serveu/payment-gateway-service:v1
    replicas: 3
    port: 8080
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 2Gi

  transactionEngine:
    image: here2serveu/transaction-engine-service:v1
    replicas: 2
    port: 8080
    resources:
      requests:
        cpu: 300m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

# OpenShift Route configuration
routes:
  - name: fraud-detection
    service: fraud-detection-service
    port: 80
    tls:
      enabled: true
      termination: edge
  - name: payment-gateway
    service: payment-gateway-service
    port: 80
    tls:
      enabled: true
      termination: edge
  - name: transaction-engine
    service: transaction-engine-service
    port: 80
    tls:
      enabled: true
      termination: edge

# Pod security context (PCI-DSS compliant)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# PCI-DSS and compliance environment variables
env:
  - name: LOG_LEVEL
    value: "info"
  - name: PCI_DSS_ENABLED
    value: "true"
  - name: ENCRYPTION_AT_REST
    value: "true"
  - name: ENCRYPTION_IN_TRANSIT
    value: "true"
  - name: ML_MODEL_VERSION
    value: "v1"
  - name: FRAUD_DETECTION_THRESHOLD
    value: "0.75"

# Autoscaling for fintech services
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 15
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Service account for fintech
serviceAccountName: nrp-fintech-sa

# Network policies for compliance
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: nrp-fintech
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: nrp-fintech

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Labels
labels:
  app: nrp-fintech
  compliance: pci-dss
  platform: openshift

# Annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  compliance.openshift.io/pci-dss: "true"
  compliance.openshift.io/sox: "true"
