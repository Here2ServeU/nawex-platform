apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ehr-service
  namespace: healthcare
  labels:
    app: ehr-service
    compliance: hipaa
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: ehr-service
  template:
    metadata:
      labels:
        app: ehr-service
        compliance: hipaa
        phi-access: "true"
    spec:
      securityContext:
        {{- toYaml .Values.security.podSecurityContext | nindent 8 }}
      containers:
        - name: ehr-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8093
          env:
            - name: PORT
              value: "8093"
            - name: FHIR_VERSION
              value: {{ .Values.config.fhirVersion | quote }}
            - name: PHI_AUDIT_ENABLED
              value: {{ .Values.config.phiAuditEnabled | quote }}
            - name: KAFKA_BROKER
              value: {{ .Values.config.kafkaBroker | quote }}
            - name: REDIS_URL
              value: {{ .Values.config.redisUrl | quote }}
          securityContext:
            {{- toYaml .Values.security.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
