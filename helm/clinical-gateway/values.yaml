# Clinical Gateway Service - Helm Values
replicaCount: 3

image:
  repository: express-reliability/patient-data-gateway
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8095

ingress:
  enabled: false

resources:
  limits:
    cpu: "1000m"
    memory: "2Gi"
  requests:
    cpu: "500m"
    memory: "1Gi"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 15
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

# Clinical gateway configuration
config:
  fhirVersion: "R4"
  supportedFormats: "FHIR-R4,HL7v2,CDA-R2,C-CDA"
  consentVerificationEnabled: "true"
  kafkaBroker: "kafka:9092"
  redisUrl: "redis://healthcare-redis:6379"
  queryTimeoutMs: 200

# HIPAA compliance settings
security:
  networkPolicy:
    enabled: true
    denyAll: true
    allowedNamespaces:
      - healthcare
      - monitoring
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false

# Health checks
livenessProbe:
  httpGet:
    path: /health
    port: 8095
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8095
  initialDelaySeconds: 5
  periodSeconds: 3
  failureThreshold: 2

# Pod disruption budget for high availability
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Topology spread for multi-AZ resilience
topologySpreadConstraints:
  enabled: true
