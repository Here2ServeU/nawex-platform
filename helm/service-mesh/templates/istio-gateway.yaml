{{- if and .Values.enabled (eq .Values.meshType "istio") }}
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: {{ .Values.istio.gatewayName }}
  namespace: {{ .Values.istio.gatewayNamespace }}
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: {{ .Values.istio.port }}
        name: http
        protocol: HTTP
      hosts:
        - {{ .Values.istio.host }}
{{- if .Values.istio.tls.enabled }}
      tls:
        mode: SIMPLE
        credentialName: {{ .Values.istio.tls.credentialName }}
{{- end }}
{{- end }}
