{{- if and .Values.enabled (eq .Values.meshType "istio") }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: express-app
  namespace: {{ .Values.namespace.name }}
spec:
  hosts:
    - {{ .Values.istio.host }}
  gateways:
    - {{ .Values.istio.gatewayNamespace }}/{{ .Values.istio.gatewayName }}
  http:
    - route:
        - destination:
            host: express-app
            port:
              number: 80
{{- end }}
