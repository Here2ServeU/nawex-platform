apiVersion: v1
kind: Service
metadata:
  name: {{ include "otel-collector.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: otlp-grpc
      port: {{ .Values.service.otlpGrpcPort }}
      targetPort: {{ .Values.service.otlpGrpcPort }}
    - name: otlp-http
      port: {{ .Values.service.otlpHttpPort }}
      targetPort: {{ .Values.service.otlpHttpPort }}
  selector:
    app.kubernetes.io/name: {{ include "otel-collector.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
