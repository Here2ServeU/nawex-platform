image:
  repository: backstage/backstage
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 7007

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: backstage.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
