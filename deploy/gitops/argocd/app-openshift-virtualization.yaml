# OpenShift only: installs OpenShift Virtualization + MTV (Forklift) operators
# for VMware -> OpenShift VM migration. Migration waves are synced separately
# (one Application per wave under deploy/openshift/virtualization/waves/<wave>).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openshift-virtualization-operators
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: golden
    component: vm-migration
spec:
  project: default
  source:
    repoURL: https://github.com/Here2ServeU/nawex-platform
    targetRevision: main
    path: deploy/openshift/virtualization/operators
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    # Operator upgrades use Manual InstallPlans; keep sync manual too.
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
