# Credentials for PgBouncer and postgres_exporter from the platform secret store
# (deploy/k8s/platform-addons/external-secrets: ClusterSecretStore `golden-secrets`).
# Requires the External Secrets Operator CRDs (kubeconform skips the schema).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pgbouncer-auth
  namespace: golden-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: golden-secrets
  target:
    name: pgbouncer-auth
    creationPolicy: Owner
  data:
    # userlist.txt lines: "app_user" "SCRAM-SHA-256$4096:…"  (SELECT rolname, rolpassword FROM pg_authid)
    - secretKey: userlist.txt
      remoteRef:
        key: golden/db/pgbouncer
        property: userlist
    - secretKey: stats-password
      remoteRef:
        key: golden/db/pgbouncer
        property: stats_password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-exporter-dsn
  namespace: golden-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: golden-secrets
  target:
    name: postgres-exporter-dsn
    creationPolicy: Owner
  data:
    - secretKey: dsn
      remoteRef:
        key: golden/db/postgres-exporter
        property: dsn
