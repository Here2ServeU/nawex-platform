# GCP Secret Manager via GKE Workload Identity. Bind the ESO KSA to a GSA:
#   iam.gke.io/gcp-service-account: eso@<project>.iam.gserviceaccount.com
# granted roles/secretmanager.secretAccessor (scope it to golden-* secrets with
# an IAM condition).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: golden-secrets
  labels:
    app.kubernetes.io/part-of: golden
    golden.io/secret-backend: gcp-secret-manager
spec:
  conditions:
    - namespaces:
        - golden
  provider:
    gcpsm:
      projectID: golden-project
      auth:
        workloadIdentity:
          clusterLocation: us-central1
          clusterName: golden
          clusterProjectID: golden-project
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
