# AWS Secrets Manager via IRSA. The External Secrets Operator ServiceAccount
# (external-secrets/external-secrets) must be annotated with
#   eks.amazonaws.com/role-arn: <role allowing secretsmanager:GetSecretValue +
#   DescribeSecret on arn:aws:secretsmanager:<region>:<account>:secret:golden/*>
# Apply exactly ONE golden-secrets store per cluster (the chart's default
# externalSecrets.secretStoreRef.name).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: golden-secrets
  labels:
    app.kubernetes.io/part-of: golden
    golden.io/secret-backend: aws-secrets-manager
spec:
  # Only the golden namespaces may read through this store.
  conditions:
    - namespaces:
        - golden
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
