# Azure Key Vault via Azure AD Workload Identity. The ESO ServiceAccount needs
#   azure.workload.identity/client-id: <user-assigned identity client id>
# with a federated credential for system:serviceaccount:external-secrets:external-secrets
# and the "Key Vault Secrets User" role on the vault.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: golden-secrets
  labels:
    app.kubernetes.io/part-of: golden
    golden.io/secret-backend: azure-key-vault
spec:
  conditions:
    - namespaces:
        - golden
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://golden-kv.vault.azure.net
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
