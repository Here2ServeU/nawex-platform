# HashiCorp Vault (KV v2) via the Kubernetes auth method. Vault side:
#   vault auth enable kubernetes
#   vault write auth/kubernetes/role/golden-external-secrets \
#     bound_service_account_names=external-secrets \
#     bound_service_account_namespaces=external-secrets \
#     policies=golden-read ttl=15m
#   golden-read: path "secret/data/golden/*" { capabilities = ["read"] }
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: golden-secrets
  labels:
    app.kubernetes.io/part-of: golden
    golden.io/secret-backend: hashicorp-vault
spec:
  conditions:
    - namespaces:
        - golden
  provider:
    vault:
      server: https://vault.vault.svc:8200
      path: secret
      version: v2
      # caProvider pins the Vault server CA (ConfigMap in the ESO namespace).
      caProvider:
        type: ConfigMap
        name: vault-ca
        key: ca.crt
        namespace: external-secrets
      auth:
        kubernetes:
          mountPath: kubernetes
          role: golden-external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
