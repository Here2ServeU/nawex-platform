# General-purpose capacity: spot first, on-demand fallback, consolidated when
# under-used. Limits cap the cost blast radius of a runaway scale-out.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general
spec:
  template:
    metadata:
      labels:
        workload-type: general
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64", "arm64"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
      # Recycle nodes monthly so AMI / kernel patches roll out.
      expireAfter: 720h
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    # At most 10% of nodes disrupted at once (PDBs are honoured too).
    budgets:
      - nodes: "10%"
  limits:
    cpu: "200"
    memory: 800Gi
  weight: 50
