# EC2NodeClass for the Golden EKS cluster (Karpenter v1). Replace <cluster>
# with the EKS cluster name (module var.name) and <node-role> with the terraform
# output karpenter_node_role_name. Subnets and the node security group are
# discovered by the karpenter.sh/discovery tag the EKS module adds when
# karpenter_enabled = true.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: golden-prod-karpenter-node
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: golden-prod
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: golden-prod
  # IMDSv2 only, one hop: pods cannot reach node credentials.
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  tags:
    app.kubernetes.io/part-of: golden
    managed-by: karpenter
