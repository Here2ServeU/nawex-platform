# NVIDIA Triton Inference Server — multi-framework (ONNX, TensorRT, PyTorch, Python backend) with
# dynamic batching and concurrent model instances. Speaks the same Open Inference Protocol (V2) as the
# platform's FraudModelServer, so clients do not change when a model moves to Triton.
#
# Runs on a MIG slice (nvidia.com/mig-3g.40gb, GPU Operator with mig.strategy=mixed) instead of a whole
# GPU: Triton's small, latency-sensitive models rarely need a full A100/H100.
# Model repository layout: see triton-model-repository/README.md (mounted at /models from the PVC).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: triton-model-repository
  namespace: golden-ml
  labels:
    app.kubernetes.io/name: triton
    app.kubernetes.io/part-of: golden
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton
  namespace: golden-ml
  labels:
    app.kubernetes.io/name: triton
    app.kubernetes.io/component: model-server
    app.kubernetes.io/part-of: golden
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: triton
  template:
    metadata:
      labels:
        app.kubernetes.io/name: triton
        app.kubernetes.io/component: model-server
        app.kubernetes.io/part-of: golden
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        nvidia.com/mig.capable: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: triton
          image: nvcr.io/nvidia/tritonserver:24.08-py3
          command: ["tritonserver"]
          args:
            - --model-repository=/models
            - --model-control-mode=poll
            - --repository-poll-secs=30
            - --strict-readiness=true
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: grpc
              containerPort: 8001
              protocol: TCP
            - name: metrics
              containerPort: 8002
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/mig-3g.40gb: "1"
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/mig-3g.40gb: "1"
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: http
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: triton-model-repository
            readOnly: true
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: triton
  namespace: golden-ml
  labels:
    app.kubernetes.io/name: triton
    app.kubernetes.io/part-of: golden
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: triton
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 8001
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: 8002
      targetPort: metrics
      protocol: TCP
