apiVersion: v2
name: golden
description: >-
  First-party umbrella chart for the Golden platform. Deploys every Python
  service (api, transaction-engine, fraud-detector, payment-gateway,
  ehr-ingestion, clinical-decision, patient-gateway, gpu-optimizer,
  migration-planner) from the single ghcr.io/here2serveu/golden-platform image, each
  started with `golden serve <name>`.
