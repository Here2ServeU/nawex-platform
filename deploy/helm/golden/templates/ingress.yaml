{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "golden.fullname" . }}
  labels:
    {{- include "golden.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          {{- $target := .service | default "api" }}
          {{- $raw := index $.Values.services $target }}
          {{- if not $raw }}
          {{- fail (printf "ingress path %s references unknown service %q" .path $target) }}
          {{- end }}
          {{- $backend := include "golden.serviceName" (dict "root" $ "name" $target) }}
          {{- $tsvc := include "golden.serviceConfig" (dict "root" $ "name" $target "cfg" $raw) | fromYaml }}
          {{- if and (include "golden.isRollout" (dict "root" $ "svc" $tsvc)) $tsvc.rollout.trafficRouting }}
          {{- /* Argo Rollouts trafficRouting: the ingress targets the stable Service. */}}
          {{- $backend = printf "%s-stable" $backend }}
          {{- end }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $backend }}
                port:
                  number: {{ $raw.port }}
          {{- end }}
    {{- end }}
{{- end }}
