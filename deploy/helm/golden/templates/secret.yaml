{{- if .Values.apiKeys.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "golden.apiKeysSecretName" . }}
  labels:
    {{- include "golden.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.apiKeys.secretKey }}: {{ required "apiKeys.value is required when apiKeys.create=true" .Values.apiKeys.value | quote }}
{{- end }}
