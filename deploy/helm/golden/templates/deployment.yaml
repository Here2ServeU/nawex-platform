{{- /*
One workload per entry in .Values.services. Renders an apps/v1 Deployment, or
an argoproj.io/v1alpha1 Rollout (canary + Prometheus analysis) when
rollouts.enabled and services.<name>.rollout.enabled. Both share the pod
template in _helpers.tpl ("golden.podTemplate").
*/}}
{{- range $name, $raw := .Values.services }}
{{- $ctx := dict "root" $ "name" $name "cfg" $raw }}
{{- $svc := include "golden.serviceConfig" $ctx | fromYaml }}
{{- if ne (toString $svc.enabled) "false" }}
{{- $pctx := dict "root" $ "name" $name "svc" $svc }}
{{- $autoscaled := or $svc.autoscaling.enabled (include "golden.isKeda" $pctx) }}
{{- if include "golden.isRollout" $pctx }}
{{- $ro := $svc.rollout }}
{{- $canary := $.Values.rollouts.canary }}
{{- $analysis := $.Values.rollouts.analysis }}
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "golden.serviceName" $ctx }}
  labels:
    {{- include "golden.serviceLabels" $ctx | nindent 4 }}
spec:
  {{- if not $autoscaled }}
  replicas: {{ $svc.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "golden.selectorLabels" $ctx | nindent 6 }}
  template:
    {{- include "golden.podTemplate" $pctx | nindent 4 }}
  strategy:
    canary:
      {{- if $ro.trafficRouting }}
      canaryService: {{ include "golden.serviceName" $ctx }}-canary
      stableService: {{ include "golden.serviceName" $ctx }}-stable
      trafficRouting:
        {{- toYaml $ro.trafficRouting | nindent 8 }}
      {{- end }}
      maxSurge: {{ $ro.maxSurge | default $canary.maxSurge | quote }}
      maxUnavailable: {{ $ro.maxUnavailable | default $canary.maxUnavailable }}
      abortScaleDownDelaySeconds: {{ $canary.abortScaleDownDelaySeconds }}
      {{- if $analysis.enabled }}
      analysis:
        templates:
          - templateName: {{ include "golden.fullname" $ }}-canary
        # Background analysis from the first pause onwards: a failed
        # measurement beyond failureLimit aborts the rollout automatically.
        startingStep: 1
        args:
          - name: service
            value: {{ printf "%s|%s" $name (include "golden.serviceName" $ctx) | quote }}
          - name: namespace
            value: {{ $.Release.Namespace | quote }}
          {{- if $analysis.selectCanaryPods }}
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
          {{- end }}
      {{- end }}
      steps:
        {{- toYaml ($ro.steps | default $canary.steps) | nindent 8 }}
{{- else }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "golden.serviceName" $ctx }}
  labels:
    {{- include "golden.serviceLabels" $ctx | nindent 4 }}
spec:
  {{- if not $autoscaled }}
  replicas: {{ $svc.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "golden.selectorLabels" $ctx | nindent 6 }}
  template:
    {{- include "golden.podTemplate" $pctx | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
