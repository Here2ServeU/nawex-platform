{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "golden.fullname" . }}
  labels:
    {{- include "golden.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/part-of: golden
    {{- if .Values.rollouts.enabled }}
    # Skip the Rollout canary/stable Services (same pods; avoids double scrapes).
    matchExpressions:
      - key: golden.io/rollout-role
        operator: DoesNotExist
    {{- end }}
  {{- if and .Values.rollouts.enabled .Values.rollouts.analysis.selectCanaryPods }}
  # Lets canary analysis select the new ReplicaSet's series.
  podTargetLabels:
    - rollouts-pod-template-hash
  {{- end }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: {{ .Values.metrics.path }}
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
{{- end }}
