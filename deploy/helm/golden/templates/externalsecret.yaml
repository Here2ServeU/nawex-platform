{{- /*
External Secrets Operator: one ExternalSecret per externalSecrets.secrets
entry, synced from externalSecrets.secretStoreRef.
*/}}
{{- if .Values.externalSecrets.enabled }}
{{- if and .Values.apiKeys.create (hasKey .Values.externalSecrets.secrets "api-keys") }}
{{- fail "externalSecrets.secrets.api-keys and apiKeys.create=true both manage the API keys Secret; disable one" }}
{{- end }}
{{- range $key, $es := .Values.externalSecrets.secrets }}
{{- $target := $es.targetName }}
{{- if not $target }}
{{- if eq $key "api-keys" }}
{{- $target = include "golden.apiKeysSecretName" $ }}
{{- else }}
{{- $target = printf "%s-%s" (include "golden.fullname" $) $key | trunc 63 | trimSuffix "-" }}
{{- end }}
{{- end }}
---
apiVersion: {{ $.Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ printf "%s-%s" (include "golden.fullname" $) $key | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "golden.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | default $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml ($es.secretStoreRef | default $.Values.externalSecrets.secretStoreRef) | nindent 4 }}
  target:
    name: {{ $target }}
    creationPolicy: Owner
    deletionPolicy: Retain
  {{- with $es.data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $es.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if not (or $es.data $es.dataFrom) }}
  {{- fail (printf "externalSecrets.secrets.%s needs data or dataFrom" $key) }}
  {{- end }}
{{- end }}
{{- end }}
