apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: splunk-forwarder
  namespace: {{ .Values.namespace }}
  labels:
    app: splunk-forwarder
spec:
  selector:
    matchLabels:
      app: splunk-forwarder
  template:
    metadata:
      labels:
        app: splunk-forwarder
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      # Reads root-owned host logs, so it runs as uid 0 - but with every
      # capability dropped, no privilege escalation and a read-only root FS.
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: fluent-bit
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          env:
            - name: SPLUNK_HEC_ENDPOINT
              value: {{ .Values.splunk.hecEndpoint | quote }}
            - name: SPLUNK_HEC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: splunk-hec-secret
                  key: hec_token
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc/
            - name: state
              mountPath: /fluent-bit/state
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: splunk-forwarder-config
