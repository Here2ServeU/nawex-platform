# app-config.yaml is stored in a Secret (not a ConfigMap) because it carries
# database connection settings; secrets themselves are injected as env vars.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backstage.fullname" . }}-config
  labels:
    {{- include "backstage.labels" . | nindent 4 }}
type: Opaque
stringData:
  # This key must match the `subPath` used in deployment.yaml
  app-config.yaml: |
    {{- toYaml .Values.appConfig | nindent 4 }}
