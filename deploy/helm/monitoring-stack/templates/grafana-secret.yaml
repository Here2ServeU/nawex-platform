{{- if not .Values.grafana.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "monitoring-stack.fullname" . }}-grafana
  labels:
    app: grafana
type: Opaque
data:
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-grafana" (include "monitoring-stack.fullname" .)) }}
  {{- if and $existing $existing.data }}
  admin-password: {{ index $existing.data "admin-password" }}
  {{- else }}
  admin-password: {{ .Values.grafana.adminPassword | default (randAlphaNum 24) | b64enc | quote }}
  {{- end }}
{{- end }}
