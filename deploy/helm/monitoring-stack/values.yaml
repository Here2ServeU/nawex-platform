prometheus:
  image: prom/prometheus:v2.55.0
  uid: 65534
  retention: "24h"
  scrapeInterval: "15s"
  resources: {}
  nodeSelector: {}
  tolerations: []

grafana:
  image: grafana/grafana:11.0.0
  uid: 472
  adminUser: admin
  # Leave empty to generate a random password (kept across upgrades), or point
  # existingSecret at a Secret with key `admin-password`.
  adminPassword: ""
  existingSecret: ""
  resources: {}
  nodeSelector: {}
  tolerations: []

service:
  type: ClusterIP
  prometheusPort: 9090
  grafanaPort: 3000
