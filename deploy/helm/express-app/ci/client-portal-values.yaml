# Client portal (Node.js) - ghcr.io/here2serveu/golden-client-portal on port 3001.
nameOverride: client-portal
image:
  repository: ghcr.io/here2serveu/golden-client-portal
service:
  targetPort: 3001
env:
  - name: NODE_ENV
    value: production
  - name: PORT
    value: "3001"
ingress:
  hosts:
    - host: portal.golden.example.com
      paths:
        - path: /
          pathType: Prefix
