# DEPRECATED: prefer the `golden` chart (deploy/helm/golden), which deploys
# payment-gateway together with every other platform service.
replicaCount: 3

# Service name passed to `golden serve <name>`.
serviceName: payment-gateway

image:
  repository: ghcr.io/here2serveu/golden-platform
  pullPolicy: IfNotPresent
  # Defaults to .Chart.AppVersion when empty.
  tag: ""

service:
  type: ClusterIP
  port: 8092

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 15
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 0

platform:
  autonomyMode: dry_run
  killSwitch: false
  # Secret holding GOLDEN_API_KEYS.
  apiKeysSecret: golden-api-keys

# Extra non-secret configuration rendered as UPPER_SNAKE_CASE env vars.
config: 
  kafkaBroker: "kafka:9092"
  kafkaTopicPayments: "payments.processed"
  kafkaTopicSettlement: "settlement.batches"
  settlementBatchInterval: "300"
  supportedCurrencies: "USD,EUR,GBP,JPY,CHF,CAD"

security:
  networkPolicy:
    enabled: true
    allowedNamespaces:
      - fintech
      - monitoring
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 3

podDisruptionBudget:
  enabled: true
  minAvailable: 2

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
