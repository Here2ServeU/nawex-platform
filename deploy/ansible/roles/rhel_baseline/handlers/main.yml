- name: Reload sshd
  ansible.builtin.service:
    name: sshd
    state: reloaded

- name: Restart auditd
  # auditd refuses systemctl restart (RefuseManualStop); use the service command.
  ansible.builtin.command: service auditd restart  # noqa: command-instead-of-module
  changed_when: true

- name: Restart chronyd
  ansible.builtin.service:
    name: chronyd
    state: restarted

- name: Reload firewalld
  ansible.builtin.service:
    name: firewalld
    state: reloaded

- name: Restart journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted

- name: Initialise aide database
  ansible.builtin.command: aide --init
  args:
    creates: /var/lib/aide/aide.db.new.gz
  notify: Activate aide database

- name: Activate aide database
  ansible.builtin.copy:
    src: /var/lib/aide/aide.db.new.gz
    dest: /var/lib/aide/aide.db.gz
    remote_src: true
    mode: "0600"
