# Example inventory. Replace with your hosts, or use a dynamic inventory
# (amazon.aws.aws_ec2, azure.azcollection.azure_rm, google.cloud.gcp_compute, or the
# OpenShift Virtualization VMs migrated by MTV).
all:
  children:
    rhel_servers:
      hosts:
        app-01.example.internal:
        db-01.example.internal:
          rhel_baseline_role: database
    bastions:
      hosts:
        bastion-01.example.internal:
          rhel_baseline_ssh_allow_tcp_forwarding: true
