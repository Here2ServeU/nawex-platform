# OpenShift overrides for the `express-app` chart (golden-workload, port 8080).
#   helm upgrade --install golden-workload deploy/helm/express-app \
#     -f deploy/openshift/helm-values/express-app-values.yaml -n golden-platform
# OpenShift exposes the app through manifests/express-app-deployment.yaml's
# Route or `oc expose service`; the chart's Ingress is disabled here.
replicaCount: 2

image:
  repository: ghcr.io/here2serveu/golden-workload
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "8080"
  - name: LOG_LEVEL
    value: "info"

podLabels:
  platform: openshift

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: express-app
          topologyKey: kubernetes.io/hostname
