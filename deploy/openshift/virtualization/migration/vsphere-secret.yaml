# vCenter credentials for the source Provider.
# !!! PLACEHOLDER VALUES - NOT REAL CREDENTIALS !!!
# Never commit real credentials. In a real environment create this Secret out of
# band (External Secrets Operator / Vault / Sealed Secrets) and remove it from
# kustomization.yaml. Use a read-only vCenter service account with the MTV
# privileges documented by Red Hat.
apiVersion: v1
kind: Secret
metadata:
  name: vsphere-credentials
  namespace: openshift-mtv
  labels:
    createdForProviderType: vsphere
    createdForResourceType: providers
type: Opaque
stringData:
  user: "REPLACE_ME@vsphere.local"
  password: "REPLACE_ME"
  url: "https://vcenter.example.com/sdk"
  # Prefer pinning the vCenter CA (cacert) over skipping TLS verification.
  insecureSkipVerify: "false"
  cacert: |
    -----BEGIN CERTIFICATE-----
    REPLACE_ME_WITH_VCENTER_CA_BUNDLE
    -----END CERTIFICATE-----
