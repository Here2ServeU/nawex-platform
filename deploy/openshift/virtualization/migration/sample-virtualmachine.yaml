# Illustrative only: roughly what MTV creates for `app-web-01` after migration
# (MTV generates the real object; do not apply this alongside a Plan for the
# same VM). Useful for reviewing sizing, networks and labels per wave.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: app-web-01
  namespace: golden-vms
  labels:
    app: app-web-01
    golden.io/migrated-from: vsphere-dc1
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app: app-web-01
        kubevirt.io/domain: app-web-01
    spec:
      domain:
        cpu:
          cores: 2
          sockets: 1
          threads: 1
        memory:
          guest: 4Gi
        firmware:
          bootloader:
            efi:
              secureBoot: false
        features:
          acpi: {}
          smm:
            enabled: true
        devices:
          disks:
            - name: disk-0
              bootOrder: 1
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              model: virtio
      networks:
        - name: default
          pod: {}
      evictionStrategy: LiveMigrate
      volumes:
        - name: disk-0
          persistentVolumeClaim:
            claimName: app-web-01-disk-0
