# Migration Toolkit for Virtualization (upstream: Forklift) operator via OLM.
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-mtv
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: migration
  namespace: openshift-mtv
spec:
  targetNamespaces:
    - openshift-mtv
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: mtv-operator
  namespace: openshift-mtv
spec:
  name: mtv-operator
  channel: release-v2.7
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Manual
