# Fintech domain - Golden platform services (golden serve <name>).
# Generated to match the platform service contract; keep in sync with deploy/helm/golden.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: transaction-engine
  namespace: golden-fintech
  labels:
    app: transaction-engine
    app.kubernetes.io/part-of: golden
  annotations:
    description: "Transaction Processing Engine with Settlement"
spec:
  to:
    kind: Service
    name: transaction-engine
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: fraud-detector
  namespace: golden-fintech
  labels:
    app: fraud-detector
    app.kubernetes.io/part-of: golden
  annotations:
    description: "PCI-DSS compliant Fraud Detection Service"
spec:
  to:
    kind: Service
    name: fraud-detector
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: payment-gateway
  namespace: golden-fintech
  labels:
    app: payment-gateway
    app.kubernetes.io/part-of: golden
  annotations:
    description: "PCI-DSS compliant Payment Gateway Service"
spec:
  to:
    kind: Service
    name: payment-gateway
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None

---
apiVersion: v1
kind: Service
metadata:
  name: transaction-engine
  namespace: golden-fintech
  labels:
    app: transaction-engine
    app.kubernetes.io/part-of: golden
spec:
  type: ClusterIP
  selector:
    app: transaction-engine
  ports:
    - name: http
      port: 8090
      targetPort: http
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: fraud-detector
  namespace: golden-fintech
  labels:
    app: fraud-detector
    app.kubernetes.io/part-of: golden
spec:
  type: ClusterIP
  selector:
    app: fraud-detector
  ports:
    - name: http
      port: 8091
      targetPort: http
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: payment-gateway
  namespace: golden-fintech
  labels:
    app: payment-gateway
    app.kubernetes.io/part-of: golden
spec:
  type: ClusterIP
  selector:
    app: payment-gateway
  ports:
    - name: http
      port: 8092
      targetPort: http
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-engine
  namespace: golden-fintech
  labels:
    app: transaction-engine
    app.kubernetes.io/part-of: golden
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: transaction-engine
  template:
    metadata:
      labels:
        app: transaction-engine
        app.kubernetes.io/part-of: golden
        domain: fintech
        compliance: pci-dss
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: golden-fintech-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: transaction-engine
          image: ghcr.io/here2serveu/golden-platform:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["golden", "serve", "transaction-engine"]
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          env:
            - name: GOLDEN_SERVICE
              value: "transaction-engine"
            - name: GOLDEN_PORT
              value: "8090"
            - name: GOLDEN_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: golden-api-keys
                  key: GOLDEN_API_KEYS
                  optional: true
            - name: PCI_DSS_ENABLED
              value: "true"
          envFrom:
            - configMapRef:
                name: golden-config
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

