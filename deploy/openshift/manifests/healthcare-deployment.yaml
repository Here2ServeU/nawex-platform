apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ehr-ingestion
  namespace: golden-healthcare
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ehr-ingestion
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
