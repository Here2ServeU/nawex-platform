apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-pdb
  namespace: golden-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api
  unhealthyPodEvictionPolicy: IfHealthyBudget

