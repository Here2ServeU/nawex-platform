apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: golden-platform-netpol
  namespace: golden-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # OpenShift router and cluster monitoring (Prometheus scrapes /metrics)
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 3001
        - protocol: TCP
          port: 8096
        - protocol: TCP
          port: 8097
    # Intra-namespace traffic
    - from:
        - podSelector: {}
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kafka / platform services in golden-platform
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: golden-platform
    # Intra-namespace traffic
    - to:
        - podSelector: {}

