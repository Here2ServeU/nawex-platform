  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # gRPC communication
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 50051
    # Intra-namespace
    - from:
        - podSelector: {}
  egress:
    # DNS
