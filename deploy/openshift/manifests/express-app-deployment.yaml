# Node.js apps in the golden-platform namespace (workload + client portal).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: golden-workload
  namespace: golden-platform
  labels:
    app: golden-workload
    app.kubernetes.io/part-of: golden
  annotations:
    haproxy.router.openshift.io/timeout: 30s
    description: "Golden workload app"
spec:
  to:
    kind: Service
    name: golden-workload
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
---
apiVersion: v1
kind: Service
metadata:
  name: golden-workload
  namespace: golden-platform
  labels:
    app: golden-workload
    app.kubernetes.io/part-of: golden
spec:
  selector:
    app: golden-workload
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: golden-workload
  namespace: golden-platform
  labels:
    app: golden-workload
    app.kubernetes.io/part-of: golden
  annotations:
    description: "Golden workload app"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: golden-workload
  template:
    metadata:
      labels:
        app: golden-workload
        app.kubernetes.io/part-of: golden
    spec:
      serviceAccountName: golden-platform-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: golden-workload
          image: ghcr.io/here2serveu/golden-workload:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: golden-workload
                topologyKey: kubernetes.io/hostname
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: golden-workload-hpa
  namespace: golden-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: golden-workload
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: golden-client-portal
  namespace: golden-platform
  labels:
    app: golden-client-portal
    app.kubernetes.io/part-of: golden
