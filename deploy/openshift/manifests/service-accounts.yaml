apiVersion: v1
kind: ServiceAccount
metadata:
  name: golden-platform-sa
  namespace: golden-platform
  labels:
    app: golden-platform
  annotations:
    description: "Service account for Golden Platform core services"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: golden-healthcare-sa
  namespace: golden-healthcare
  labels:
    app: golden-healthcare
  annotations:
    description: "Service account for Healthcare services with HIPAA compliance"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: golden-fintech-sa
  namespace: golden-fintech
  labels:
    app: golden-fintech
  annotations:
    description: "Service account for Fintech services with PCI-DSS compliance"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: golden-robotics-sa
  namespace: golden-robotics
  labels:
    app: golden-robotics
  annotations:
    description: "Service account for Robotics and edge control services"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: golden-platform-role
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: golden-platform-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: golden-platform-role
subjects:
  - kind: ServiceAccount
    name: golden-platform-sa
    namespace: golden-platform
  - kind: ServiceAccount
    name: golden-healthcare-sa
    namespace: golden-healthcare
  - kind: ServiceAccount
    name: golden-fintech-sa
    namespace: golden-fintech
  - kind: ServiceAccount
    name: golden-robotics-sa
    namespace: golden-robotics

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: golden-pod-reader
  namespace: golden-platform
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: golden-pod-reader-binding
  namespace: golden-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: golden-pod-reader
subjects:
  - kind: ServiceAccount
    name: golden-platform-sa
    namespace: golden-platform

---
# Grants the golden service accounts permission to use the golden-scc SCC
# (fixed UID 10001 within the 1000-65535 range).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: golden-scc-user
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["golden-scc"]
    verbs: ["use"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: golden-scc-user-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: golden-scc-user
subjects:
  - kind: ServiceAccount
    name: golden-platform-sa
    namespace: golden-platform
  - kind: ServiceAccount
    name: golden-healthcare-sa
    namespace: golden-healthcare
  - kind: ServiceAccount
    name: golden-fintech-sa
    namespace: golden-fintech
