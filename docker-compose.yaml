version: "3.8"

services:
  # The Nervous System: High-frequency gRPC Server
  surgical-brain:
    build:
      context: .
      dockerfile: robotics/grpc/Dockerfile
    container_name: surgical_brain_server
    ports:
      - "50051:50051"
    volumes:
      - ./robotics/logs:/app/robotics/logs
    networks:
      - clinical-net

  # The Robot: Telemetry Client simulating kinematic stress
  surgical-robot:
    build:
      context: .
      dockerfile: robotics/grpc/Dockerfile
    container_name: surgical_robot_client
    depends_on:
      - surgical-brain
    command: python3 robotics/grpc/surgical_client.py
    networks:
      - clinical-net

  # The Watchdog: Ensuring 99.999% availability of safety agents
  safety-watchdog:
    image: alpine:latest
    container_name: clinical_safety_watchdog
    volumes:
      - ./robotics/agents:/agents
      - ./robotics/logs:/logs
    entrypoint: /bin/sh /agents/agent_health_check.sh
    depends_on:
      - surgical-brain
    networks:
      - clinical-net

  # Kafka and Zookeeper: Internal event backbone for telemetry
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: kafka_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    networks:
      - clinical-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka_broker
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions.sh",
          "--bootstrap-server",
          "kafka:9092",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - clinical-net

networks:
  clinical-net:
    driver: bridge

volumes:
  kafka-data:
  zookeeper-data:
  zookeeper-log:
